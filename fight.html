/* === js/engine/character.js === */
class Fighter {
    constructor(type, opts = {}) {
        this.type = type;
        this.stats = SpriteFactory.getCharacterStats(type);
        this.config = CHARACTERS[type];
        
        this.x = opts.x || 200;
        this.y = opts.y || 300;
        this.facing = opts.facing || 1;
        this.scale = opts.scale || 1;
        this.groundY = opts.groundY || 400;
        
        this.width = 50;
        this.height = 150;
        
        this.hp = this.stats.hp;
        this.maxHp = this.stats.hp;
        this.energy = 0;
        this.maxEnergy = 100;
        
        this.state = 'idle';
        this.prevState = 'idle';
        this.stateTime = 0;
        this.frame = 0;
        this.animSpeed = 15;
        
        this.velocityX = 0;
        this.velocityY = 0;
        this.speed = this.stats.speed;
        this.jumpPower = this.stats.jumpPower;
        this.gravity = 0.8;
        
        this.isGrounded = true;
        this.isBlocking = false;
        this.isDashing = false;
        this.dashDir = 0;
        this.dashTime = 0;
        this.dashCooldown = 0;
        
        this.hitbox = { x: 0, y: 0, w: 0, h: 0, active: false, damage: 0, knockback: 0, type: '' };
        this.hurtboxActive = true;
        this.invincibleTime = 0;
        this.attackCooldown = 0;
        
        this.comboCount = 0;
        this.comboTimer = 0;
        
        this.currentSkillProjectiles = [];
        this.currentUltraLevel = 0;
        
        this.dead = false;
        this.respawnTimer = 0;
        this.winTimer = 0;
        
        this.hitstop = 0;
        this.onGround = true;
    }

    reset(x, facing) {
        this.x = x;
        this.y = this.groundY;
        this.facing = facing;
        this.hp = this.maxHp;
        this.energy = 0;
        this.state = 'idle';
        this.prevState = 'idle';
        this.stateTime = 0;
        this.frame = 0;
        this.velocityX = 0;
        this.velocityY = 0;
        this.isGrounded = true;
        this.isBlocking = false;
        this.isDashing = false;
        this.invincibleTime = 0;
        this.attackCooldown = 0;
        this.hurtboxActive = true;
        this.currentSkillProjectiles = [];
        this.currentUltraLevel = 0;
        this.comboCount = 0;
        this.comboTimer = 0;
        this.dead = false;
        this.winTimer = 0;
    }

    get input() {
        return InputManager.playerKeys[this.isP2 ? 'p2' : 'p1'];
    }

    setPlayer(player) {
        this.isP2 = player === 'p2';
    }

    getPlayerInput() {
        const key = this.isP2 ? 'p2' : 'p1';
        return InputManager.playerKeys[key];
    }

    justPressed(action) {
        const key = this.isP2 ? 'p2' : 'p1';
        return InputManager.wasJustPressed(key, action);
    }

    canAct() {
        return !this.dead && this.state !== 'hurt' && this.state !== 'attack' && 
               this.state !== 'heavy' && this.state !== 'skill' && 
               this.state !== 'ultra' && !this.isDashing && this.winTimer <= 0;
    }

    update(dt, stageW, stage) {
        if (this.hitstop > 0) {
            this.hitstop -= dt;
            return;
        }

        if (this.dead) {
            this.respawnTimer -= dt;
            if (this.respawnTimer <= 0) {
                this.hurtboxActive = true;
            }
            return;
        }

        if (this.winTimer > 0) {
            this.winTimer -= dt;
            this.state = 'win';
            this.stateTime += dt;
            this.frame = Math.floor(this.stateTime * this.animSpeed) % 30;
            return;
        }

        const keys = this.getPlayerInput();
        const wasPressed = (a) => this.justPressed(a);

        // 状态计时器
        this.stateTime += dt;
        this.frame = Math.floor(this.stateTime * this.animSpeed);

        // 冷却计时
        this.attackCooldown = Math.max(0, this.attackCooldown - dt);
        this.dashCooldown = Math.max(0, this.dashCooldown - dt);
        this.invincibleTime = Math.max(0, this.invincibleTime - dt);
        this.comboTimer = Math.max(0, this.comboTimer - dt);
        if (this.comboTimer <= 0) this.comboCount = 0;

        // 被动能量恢复
        this.energy = Math.min(this.maxEnergy, this.energy + dt * 3);

        // 更新技能投射物
        this.currentSkillProjectiles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt;
        });
        this.currentSkillProjectiles = this.currentSkillProjectiles.filter(p => p.life > 0);

        // ===== 状态处理 =====
        if (this.state === 'hurt') {
            this._updateHurt(dt);
            return;
        }
        
        if (this.state === 'attack' || this.state === 'heavy') {
            this._updateAttack(dt);
            return;
        }

        if (this.state === 'skill') {
            this._updateSkill(dt);
            return;
        }

        if (this.state === 'ultra') {
            this._updateUltra(dt);
            return;
        }

        if (this.isDashing) {
            this._updateDash(dt);
            return;
        }

        if (this.state === 'block') {
            this._updateBlock(keys, stageW);
            return;
        }

        // ===== 空闲/移动状态 =====
        let newState = 'idle';

        // 跳跃
        if ((wasPressed('up') || wasPressed('dash')) && this.isGrounded) {
            if (wasPressed('dash')) {
                this._doDash(keys);
                return;
            } else {
                this._jump();
                newState = 'jump';
            }
        }

        // 格挡
        if (keys.block && this.isGrounded) {
            this._enterBlock();
            return;
        }

        // 攻击指令
        if (this.attackCooldown <= 0) {
            if (wasPressed('skill') && this.energy >= 30) {
                this._startSkill();
                return;
            }
            if (wasPressed('heavy') && this.energy >= 15) {
                this._startAttack(true);
                return;
            }
            if (wasPressed('light')) {
                this._startAttack(false);
                return;
            }
        }

        if (!this.isGrounded) {
            newState = this.velocityY < 0 ? 'jump' : 'fall';
        } else if (Math.abs(this.velocityX) > 0.5) {
            newState = 'walk';
        }

        // 水平移动
        let moveX = 0;
        if (keys.left) moveX -= 1;
        if (keys.right) moveX += 1;

        if (moveX !== 0 && this.isGrounded) {
            this.facing = moveX > 0 ? 1 : -1;
            this.velocityX = moveX * this.speed;
        } else if (this.isGrounded) {
            this.velocityX *= 0.7;
            if (Math.abs(this.velocityX) < 0.1) this.velocityX = 0;
        }

        // 应用物理
        this._applyPhysics(dt, stageW);

        // 更新状态
        if (this.state !== newState) {
            this.prevState = this.state;
            this.state = newState;
            this.stateTime = 0;
        }

        // 更新角色朝向
        if (moveX !== 0 && this.isGrounded) {
            this.facing = moveX > 0 ? 1 : -1;
        }
    }

    _applyPhysics(dt, stageW) {
        // 重力
        if (!this.isGrounded) {
            this.velocityY += this.gravity;
        }

        this.x += this.velocityX;
        this.y += this.velocityY;

        // 边界
        const half = this.width / 2;
        this.x = MathUtils.clamp(this.x, half, stageW - half);

        // 地面碰撞
        if (this.y >= this.groundY) {
            if (!this.isGrounded && this.velocityY > 5) {
                AudioManager.playSFX('land');
                EffectManager.createDashEffect(this.x, this.groundY - 30, 0.5, 4);
            }
            this.y = this.groundY;
            this.velocityY = 0;
            this.isGrounded = true;
        } else {
            this.isGrounded = false;
        }
    }

    _jump() {
        if (!this.isGrounded) return;
        this.velocityY = -this.jumpPower;
        this.isGrounded = false;
        this.state = 'jump';
        this.stateTime = 0;
        AudioManager.playSFX('jump');
    }

    _doDash(keys) {
        if (this.dashCooldown > 0) return;
        this.isDashing = true;
        this.isBlocking = false;
        
        let dir = this.facing;
        if (keys.left) dir = -1;
        else if (keys.right) dir = 1;
        
        this.dashDir = dir;
        this.dashTime = 0.25;
        this.dashCooldown = 0.6;
        this.velocityX = dir * 18;
        this.velocityY = this.isGrounded ? 0 : this.velocityY * 0.5;
        this.invincibleTime = 0.25;
        this.state = 'dash';
        this.stateTime = 0;
        EffectManager.createDashEffect(this.x, this.y - 50, dir, 8);
        AudioManager.playSFX('dash');
    }

    _updateDash(dt) {
        this.dashTime -= dt;
        this.stateTime += dt;
        this.frame = Math.floor(this.stateTime * 25);
        this.velocityX = this.dashDir * 18;
        this._applyPhysics(dt, 2000);
        
        if (this.dashTime <= 0) {
            this.isDashing = false;
            this.state = 'idle';
            this.stateTime = 0;
            this.velocityX *= 0.3;
        }
    }

    _enterBlock() {
        this.state = 'block';
        this.stateTime = 0;
        this.isBlocking = true;
        this.velocityX *= 0.3;
    }

    _updateBlock(keys, stageW) {
        this.stateTime += 0.016;
        this.frame = Math.floor(this.stateTime * 10);
        
        if (!keys.block || !this.isGrounded) {
            this.isBlocking = false;
            this.state = 'idle';
            this.stateTime = 0;
        }
    }

    _startAttack(isHeavy) {
        this.state = isHeavy ? 'heavy' : 'attack';
        this.stateTime = 0;
        this.frame = 0;
        this.isBlocking = false;
        this.velocityX = 0;
        this.attackCooldown = isHeavy ? 0.5 : 0.3;
        
        if (isHeavy) {
            this.energy -= this.stats.heavyCost;
            this.energy = Math.max(0, this.energy);
        }
        
        AudioManager.playSFX(isHeavy ? 'hit_heavy' : 'hit_light');
    }

    _updateAttack(dt) {
        this.stateTime += dt;
        this.frame = Math.floor(this.stateTime * this.animSpeed);
        
        const isHeavy = this.state === 'heavy';
        const totalFrames = isHeavy ? 12 : 8;
        const hitFrame = isHeavy ? 5 : 3;
        
        if (this.frame === hitFrame) {
            this._activateHitbox(isHeavy ? 'bash' : 'punch', isHeavy);
        }
        
        if (this.frame >= totalFrames) {
            this.state = 'idle';
            this.stateTime = 0;
            this.hitbox.active = false;
        }
    }

    _startSkill() {
        this.state = 'skill';
        this.stateTime = 0;
        this.frame = 0;
        this.isBlocking = false;
        this.velocityX *= 0.3;
        this.energy -= this.stats.skillCost;
        
        const skills = {
            0: () => this._doSkill('wave'),
            1: () => this._doSkill('grapple'),
            2: () => this._doSkill('bullet'),
            3: () => this._doSkill('wave'),
            4: () => this._doSkill('dagger_throw'),
            5: () => this._doSkill('paw_flurry')
        };
        (skills[this.type] || skills[0])();
    }

    _doSkill(type) {
        setTimeout(() => {
            const keys = this.getPlayerInput();
            AudioManager.playSFX('hit_skill');
            EffectManager.createSkillEffect(this.x + this.facing * 60, this.y - 50, type, this.facing);
            
            const baseDamage = 150;
            let damage = baseDamage;
            let knockback = 8;
            
            switch(type) {
                case 'bullet':
                    damage = 120;
                    // 创建弹幕投射物
                    for (let i = -2; i <= 2; i++) {
                        this.currentSkillProjectiles.push({
                            x: this.x + this.facing * 40,
                            y: this.y - 60 + i * 12,
                            vx: this.facing * 14,
                            vy: i * 0.5,
                            damage: damage,
                            knockback: 5,
                            life: 1.5,
                            ownerType: this.type,
                            type: 'skill'
                        });
                    }
                    break;
                case 'dagger_throw':
                    damage = 180;
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            if (this.state !== 'hurt') {
                                this.currentSkillProjectiles.push({
                                    x: this.x + this.facing * 40,
                                    y: this.y - 60 + i * 5 - 5,
                                    vx: this.facing * 16,
                                    vy: 0,
                                    damage: damage,
                                    knockback: 6,
                                    life: 1.2,
                                    ownerType: this.type,
                                    type: 'dagger'
                                });
                            }
                        }, i * 80);
                    }
                    break;
                case 'wave':
                    damage = 160;
                    this.hitbox = {
                        x: this.x + this.facing * 40,
                        y: this.y - 80,
                        w: 100,
                        h: 120,
                        active: true,
                        damage: damage,
                        knockback: 12,
                        type: 'wave'
                    };
                    this.hitboxLifetime = 0.3;
                    break;
                case 'grapple':
                    damage = 200;
                    this.hitbox = {
                        x: this.x + this.facing * 20,
                        y: this.y - 80,
                        w: 80,
                        h: 120,
                        active: true,
                        damage: damage,
                        knockback: 15,
                        type: 'grapple'
                    };
                    this.hitboxLifetime = 0.4;
                    break;
                case 'paw_flurry':
                    damage = 100;
                    this.hitbox = {
                        x: this.x + this.facing * 30,
                        y: this.y - 80,
                        w: 90,
                        h: 110,
                        active: true,
                        damage: damage,
                        knockback: 5,
                        type: 'flurry'
                    };
                    this.hitboxLifetime = 0.5;
                    break;
            }
        }, 200);
    }

    _updateSkill(dt) {
        this.stateTime += dt;
        this.frame = Math.floor(this.stateTime * this.animSpeed);
        if (this.hitbox.active) {
            this.hitboxLifetime -= dt;
            if (this.hitboxLifetime <= 0) {
                this.hitbox.active = false;
            }
        }
        
        const totalFrames = 14;
        if (this.frame >= totalFrames) {
            this.state = 'idle';
            this.stateTime = 0;
            this.hitbox.active = false;
        }
    }

    _startUltra() {
        if (this.energy < this.stats.ultraCost || this.canAct() === false) return false;
        this.energy -= this.stats.ultraCost;
        this.state = 'ultra';
        this.stateTime = 0;
        this.frame = 0;
        this.isBlocking = false;
        this.velocityX = 0;
        this.hurtboxActive = false;
        EffectManager.createUltraEffect(this.x + this.facing * 80, this.y - 60, 'ultra', this.facing);
        AudioManager.playSFX('ultra');
        
        // 设置大范围hitbox
        setTimeout(() => {
            if (this.state === 'ultra') {
                this.hitbox = {
                    x: this.x + this.facing * 30,
                    y: this.y - 120,
                    w: 250,
                    h: 200,
                    active: true,
                    damage: 500,
                    knockback: 25,
                    type: 'ultra'
                };
                this.hitboxLifetime = 0.8;
            }
        }, 400);
        
        return true;
    }

    _updateUltra(dt) {
        this.stateTime += dt;
        this.frame = Math.floor(this.stateTime * 18);
        this.hurtboxActive = false;
        
        if (this.hitbox.active) {
            this.hitboxLifetime -= dt;
            if (this.hitboxLifetime <= 0) {
                this.hitbox.active = false;
            }
        }
        
        const totalFrames = 30;
        if (this.frame >= totalFrames) {
            this.state = 'idle';
            this.stateTime = 0;
            this.hurtboxActive = true;
            this.hitbox.active = false;
        }
    }

    _activateHitbox(type, isHeavy) {
        const reach = isHeavy ? 70 : 50;
        const damage = isHeavy ? this.stats.attack * 1.8 : this.stats.attack * 1.0;
        const knockback = isHeavy ? 12 : 6;
        
        this.hitbox = {
            x: this.x + this.facing * reach - 20,
            y: this.y - 90,
            w: 60,
            h: 100,
            active: true,
            damage: damage,
            knockback: knockback,
            type: type
        };
        this.hitboxLifetime = 0.08;
    }

    _updateHurt(dt) {
        this.stateTime += dt;
        this.frame = Math.floor(this.stateTime * 15);
        this.velocityX *= 0.9;
        this._applyPhysics(dt, 2000);
        
        if (this.frame >= 10) {
            this.state = 'idle';
            this.stateTime = 0;
        }
    }

    takeHit(damage, knockback, attackerFacing, hitType) {
        if (this.invincibleTime > 0 || this.dead) return false;

        let actualDamage = damage;
        
        // 格挡
        if (this.isBlocking && this.state === 'block') {
            const isFromFront = (this.facing === attackerFacing);
            if (isFromFront) {
                actualDamage = damage * 0.1;
                EffectManager.createBlockEffect(this.x - this.facing * 30, this.y - 50, attackerFacing);
                AudioManager.playSFX('block');
            } else {
                actualDamage = damage * this.stats.defense;
                this._doHurt(actualDamage, knockback * 0.5, attackerFacing);
            }
        } else {
            actualDamage = damage * this.stats.defense;
            this._doHurt(actualDamage, knockback, attackerFacing);
        }

        this.hp = Math.max(0, this.hp - actualDamage);

        // 能量获取
        this.energy = Math.min(this.maxEnergy, this.energy + 15);
        
        // 连击
        if (hitType !== 'blocked') {
            this.comboCount++;
            this.comboTimer = 2;
        }

        if (this.hp <= 0) {
            this._doDeath();
        }

        return true;
    }

    _doHurt(damage, knockback, attackerFacing) {
        const effectType = this.stats.weapon === 'dagger' ? 'dagger' : 
                           this.stats.weapon === 'mirror' ? 'magic' :
                           this.stats.weapon === 'paw' ? 'paw' :
                           this.stats.weapon === 'hand' ? 'punch' :
                           this.stats.weapon === 'fist' ? 'punch' : 'punch';
        
        EffectManager.createHitEffect(
            this.x - attackerFacing * 30, 
            this.y - 60, 
            effectType,
            -attackerFacing
        );
        
        EffectManager.createFloatText(
            this.x, 
            this.y - 100, 
            Math.round(damage).toString(), 
            damage > 300 ? '#ffee00' : (damage > 150 ? '#ff8800' : '#ff2a45')
        );

        AudioManager.playSFX(
            effectType === 'dagger' ? 'dagger_slash' :
            effectType === 'magic' ? 'magic' :
            damage > 200 ? 'hit_heavy' : 'hit_light'
        );

        this.state = 'hurt';
        this.stateTime = 0;
        this.velocityX = -attackerFacing * knockback;
        this.velocityY = -3;
        this.isBlocking = false;
        this.invincibleTime = 0.3;
        this.hitstop = 0.05;
        this.hurtboxActive = false;
    }

    _doDeath() {
        this.dead = true;
        this.state = 'dead';
        this.stateTime = 0;
        this.hurtboxActive = false;
        this.velocityX = 0;
        this.velocityY = -5;
        AudioManager.playSFX('knockdown');
        EffectManager.createKnockdownEffect(this.x, this.groundY);
    }

    getHitbox() {
        return this.hitbox;
    }

    getHurtbox() {
        if (!this.hurtboxActive || this.isDashing) return null;
        return {
            x: this.x - this.width / 2 - 5,
            y: this.y - this.height - 5,
            w: this.width + 10,
            h: this.height + 10
        };
    }

    checkAttackVs(target) {
        const hb = this.getHitbox();
        if (!hb || !hb.active) return false;
        
        const targetHb = target.getHurtbox();
        if (!targetHb) return false;
        
        if (MathUtils.rectsOverlap(
            { x: hb.x, y: hb.y, w: hb.w, h: hb.h },
            targetHb
        )) {
            hb.active = false;
            
            const isHeavy = hb.type === 'bash';
            const isUlt = hb.type === 'ultra';
            
            const success = target.takeHit(
                hb.damage, 
                hb.knockback, 
                this.facing,
                isUlt ? 'ultra' : (isHeavy ? 'heavy' : 'light')
            );
            
            if (success) {
                // 从击中获得能量
                this.energy = Math.min(this.maxEnergy, this.energy + 6);
            }
            
            return success;
        }
        return false;
    }

    checkProjectileVs(target) {
        for (let i = this.currentSkillProjectiles.length - 1; i >= 0; i--) {
            const p = this.currentSkillProjectiles[i];
            if (!target.hurtboxActive) continue;
            
            const pRect = {
                x: p.x - 15,
                y: p.y - 15,
                w: 30,
                h: 30
            };
            
            const tHb = target.getHurtbox();
            if (tHb && MathUtils.rectsOverlap(pRect, tHb)) {
                target.takeHit(p.damage, p.knockback, Math.sign(p.vx), 'skill');
                this.currentSkillProjectiles.splice(i, 1);
                return true;
            }
        }
        return false;
    }

    draw(ctx, cameraShake = 0) {
        if (this.dead && this.stateTime > 1.0) {
            ctx.globalAlpha = MathUtils.clamp(1 - (this.stateTime - 1.0), 0, 1);
        }
        
        ctx.save();
        ctx.translate(this.x + cameraShake, this.y);
        
        SpriteFactory.drawCharacter(this.type, this.state, this.frame, ctx, {
            facing: this.facing,
            scale: this.scale
        });
        
        // 投射物可视化
        this.currentSkillProjectiles.forEach(p => {
            ctx.save();
            if (p.type === 'dagger') {
                ctx.fillStyle = '#00e5ff';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.vx > 0 ? 0 : Math.PI);
                ctx.beginPath();
                ctx.moveTo(-10, 0);
                ctx.lineTo(10, -3);
                ctx.lineTo(10, 3);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else {
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 15);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.5, '#aa44ff');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });
        
        // 格挡光盾
        if (this.isBlocking && this.state === 'block') {
            ctx.save();
            ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.01) * 0.1;
            const shieldGrad = ctx.createRadialGradient(
                this.x - this.facing * 40, this.y - 60, 0,
                this.x - this.facing * 40, this.y - 60, 70
            );
            shieldGrad.addColorStop(0, 'rgba(74,158,255,0.8)');
            shieldGrad.addColorStop(1, 'rgba(74,158,255,0)');
            ctx.fillStyle = shieldGrad;
            ctx.beginPath();
            ctx.arc(-this.facing * 40, -60, 70, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        
        ctx.restore();
        ctx.globalAlpha = 1;
    }
}

/* === js/engine/game.js === */
class Game {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        
        this.baseW = 1280;
        this.baseH = 720;
        
        this.p1 = null;
        this.p2 = null;
        this.currentStage = null;
        
        this.gameState = 'menu';
        this.selectedP1 = 0;
        this.selectedP2 = 1;
        this.selectedStage = 0;
        
        this.round = 1;
        this.maxRounds = 3;
        this.wins = { p1: 0, p2: 0 };
        
        this.timer = 60;
        this.lastTime = 0;
        this.cameraShake = 0;
        this.announceTimer = 0;
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.fighters = [];
        this.groundY = 550;
        
        this.ultraEnabled = false;
        this._ultraCharging = false;
    }

    resize() {
        const container = document.getElementById('game-container');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        let targetW = cw;
        let targetH = targetW * 9 / 16;
        
        if (targetH > ch) {
            targetH = ch;
            targetW = targetH * 16 / 9;
        }
        
        this.canvas.width = this.baseW;
        this.canvas.height = this.baseH;
        this.canvas.style.width = targetW + 'px';
        this.canvas.style.height = targetH + 'px';
    }

    initBattle() {
        InputManager.init();
        AudioManager.init();
        
        const canvas = this.canvas;
        this.ctx.imageSmoothingEnabled = true;
        
        this.selectedP1 = 0;
        this.selectedP2 = 1;
        this.selectedStage = 0;
    }

    startBattle(p1Type, p2Type, stageId) {
        this.selectedP1 = p1Type;
        this.selectedP2 = p2Type;
        this.selectedStage = stageId;
        this.round = 1;
        this.wins = { p1: 0, p2: 0 };
        this.cpuMode = GameApp.cpuMode || false;

        StageManager.selectStage(stageId);
        this._setupRound();
        this.gameState = 'battle';
        
        const stage = StageManager.stages[stageId];
        AudioManager.playBGM(stage.bgm);
        
        this._runLoop();
    }

    _setupRound() {
        this.p1 = new Fighter(this.selectedP1, {
            x: 400,
            y: this.groundY,
            facing: 1,
            groundY: this.groundY
        });
        this.p1.setPlayer('p1');
        
        this.p2 = new Fighter(this.selectedP2, {
            x: 880,
            y: this.groundY,
            facing: -1,
            groundY: this.groundY
        });
        this.p2.setPlayer('p2');
        
        this.fighters = [this.p1, this.p2];
        this.timer = 60;
        this.cameraShake = 0;
        
        this._announceRound('ROUND ' + this.round);
        this._resetRoundPositions();
        this._announceFight();
    }

    _resetRoundPositions() {
        this.p1.reset(400, 1);
        this.p2.reset(880, -1);
        this.p1.groundY = this.groundY;
        this.p2.groundY = this.groundY;
    }

    _announceRound(text) {
        this.announceTimer = 1.2;
        const el = document.getElementById('round-announce');
        document.getElementById('announce-text').textContent = text;
        el.classList.remove('hidden');
        AudioManager.playSFX('announce');
        setTimeout(() => {
            el.classList.add('hidden');
        }, 1200);
    }

    _announceFight() {
        setTimeout(() => {
            if (this.gameState === 'battle' && this.round > 0) {
                const el = document.getElementById('round-announce');
                document.getElementById('announce-text').textContent = 'FIGHT!';
                el.classList.remove('hidden');
                AudioManager.playSFX('announce');
                setTimeout(() => {
                    el.classList.add('hidden');
                }, 800);
            }
        }, 1400);
    }

    _runLoop() {
        if (this._loopRunning) return;
        this._loopRunning = true;
        this.lastTime = performance.now();
        
        const loop = (now) => {
            if (this.gameState !== 'battle') {
                this._loopRunning = false;
                return;
            }
            
            let dt = (now - this.lastTime) / 1000;
            this.lastTime = now;
            dt = Math.min(dt, 0.05);
            
            this.update(dt);
            this.render();
            
            requestAnimationFrame(loop);
        };
        
        requestAnimationFrame(loop);
    }

    _updateAI(dt) {
        if (!this.cpuMode || !this.p2 || this.p2.dead) return;
        const ai = this.p2;
        const target = this.p1;
        const dist = Math.abs(ai.x - target.x);
        const dir = target.x > ai.x ? 1 : -1;

        // AI 决策周期
        this._aiTimer = (this._aiTimer || 0) - dt;
        if (this._aiTimer <= 0) {
            this._aiTimer = 0.3 + Math.random() * 0.4;
            this._aiAction = this._decideAIAction(dist, ai, target);
        }

        const action = this._aiAction;
        const aiKeys = InputManager.playerKeys.p2;

        // 重置所有按键
        aiKeys.up = aiKeys.down = aiKeys.left = aiKeys.right = false;
        aiKeys.light = aiKeys.heavy = aiKeys.skill = aiKeys.block = aiKeys.dash = false;

        if (ai.canAct()) {
            switch (action) {
                case 'approach':
                    if (dir > 0) aiKeys.right = true;
                    else aiKeys.left = true;
                    break;
                case 'retreat':
                    if (dir > 0) aiKeys.left = true;
                    else aiKeys.right = true;
                    break;
                case 'attack_light':
                    if (dist < 120) {
                        if (!this._aiAttacked) {
                            InputManager.justPressed.p2.light = true;
                            this._aiAttacked = true;
                        }
                    } else {
                        if (dir > 0) aiKeys.right = true;
                        else aiKeys.left = true;
                    }
                    break;
                case 'attack_heavy':
                    if (dist < 130 && ai.energy >= 15) {
                        if (!this._aiAttacked) {
                            InputManager.justPressed.p2.heavy = true;
                            this._aiAttacked = true;
                        }
                    } else {
                        if (dir > 0) aiKeys.right = true;
                        else aiKeys.left = true;
                    }
                    break;
                case 'use_skill':
                    if (ai.energy >= 30) {
                        if (!this._aiAttacked) {
                            InputManager.justPressed.p2.skill = true;
                            this._aiAttacked = true;
                        }
                    }
                    break;
                case 'block':
                    aiKeys.block = true;
                    break;
                case 'jump':
                    if (!this._aiAttacked) {
                        InputManager.justPressed.p2.up = true;
                        this._aiAttacked = true;
                    }
                    break;
                case 'dash':
                    if (!this._aiAttacked) {
                        InputManager.justPressed.p2.dash = true;
                        this._aiAttacked = true;
                    }
                    break;
                case 'ultra':
                    if (ai.energy >= 100) {
                        if (!this._aiAttacked) {
                            InputManager.justPressed.p2.ultra = true;
                            this._aiAttacked = true;
                        }
                    }
                    break;
                case 'idle':
                default:
                    break;
            }
        }

        // AI 自动面对玩家
        if (ai.state !== 'hurt' && ai.state !== 'attack' && ai.state !== 'heavy' &&
            ai.state !== 'skill' && ai.state !== 'ultra') {
            ai.facing = target.x > ai.x ? 1 : -1;
        }
    }

    _decideAIAction(dist, ai, target) {
        this._aiAttacked = false;

        // 血量低时更倾向防御或后退
        const hpRatio = ai.hp / ai.maxHp;

        if (ai.energy >= 100 && dist < 300 && Math.random() < 0.7) return 'ultra';

        if (hpRatio < 0.3) {
            if (Math.random() < 0.3) return 'block';
            if (Math.random() < 0.3) return 'retreat';
        }

        if (dist < 80) {
            const r = Math.random();
            if (r < 0.3) return 'attack_light';
            if (r < 0.5 && ai.energy >= 15) return 'attack_heavy';
            if (r < 0.6) return 'block';
            if (r < 0.7) return 'jump';
            if (r < 0.8) return 'dash';
            return 'attack_light';
        } else if (dist < 200) {
            if (ai.energy >= 30 && Math.random() < 0.4) return 'use_skill';
            if (Math.random() < 0.6) return 'approach';
            if (Math.random() < 0.5) return 'attack_light';
            return 'approach';
        } else {
            if (ai.energy >= 30 && Math.random() < 0.3) return 'use_skill';
            return 'approach';
        }
    }

    update(dt) {
        const keys = {
            p1: InputManager.playerKeys.p1,
            p2: InputManager.playerKeys.p2
        };

        // CPU 模式下由 AI 控制 P2（在读取输入/必杀检测之前）
        if (this.cpuMode) {
            this._updateAI(dt);
        }

        // 必杀技检测（专属必杀按键）
        if (this.selectedP1 !== undefined && this.p1 && !this.p1.dead) {
            if (this.p1.energy >= 100 &&
                InputManager.wasJustPressed('p1', 'ultra') &&
                this.p1.canAct()) {
                if (this.p1._startUltra()) {
                    EffectManager.createUltraEffect(this.p1.x + this.p1.facing * 60, this.p1.y - 50, 'ultra', this.p1.facing);
                    this._showUltraAnnounce();
                }
            }
        }
        if (this.p2 && !this.p2.dead) {
            if (this.p2.energy >= 100 &&
                InputManager.wasJustPressed('p2', 'ultra') &&
                this.p2.canAct()) {
                if (this.p2._startUltra()) {
                    EffectManager.createUltraEffect(this.p2.x + this.p2.facing * 60, this.p2.y - 50, 'ultra', this.p2.facing);
                    this._showUltraAnnounce();
                }
            }
        }

        // 更新角色
        this.p1.update(dt, this.baseW, StageManager.currentBg);
        this.p2.update(dt, this.baseW, StageManager.currentBg);

        // 角色互相面对对方（自动对齐朝向）
        if (Math.abs(this.p1.x - this.p2.x) < this.baseW * 0.8) {
            // 保持玩家输入控制朝向
        }

        // 碰撞检测
        this._checkCollisions();

        // 相机震动
        if (this.cameraShake > 0) {
            this.cameraShake -= dt * 30;
            if (this.cameraShake < 0) this.cameraShake = 0;
        }

        // 特效更新
        EffectManager.update(dt);

        // 计时器
        this.timer -= dt;
        if (this.timer <= 0) {
            this.timer = 0;
            this._roundEnd();
        }

        // 检查胜负
        if (this.p1.dead && this.p1.stateTime > 0.8) {
            // P2 胜利
            this._winRound('p2');
        } else if (this.p2.dead && this.p2.stateTime > 0.8) {
            this._winRound('p1');
        }

        // 更新角色朝向（如果没有按键输入时自动面向对手）
        if (this.p1.state !== 'hurt' && this.p1.state !== 'attack' && 
            this.p1.state !== 'heavy' && this.p1.state !== 'skill' &&
            this.p1.state !== 'ultra') {
            const p1Keys = InputManager.playerKeys.p1;
            if (!p1Keys.left && !p1Keys.right) {
                this.p1.facing = this.p2.x > this.p1.x ? 1 : -1;
            }
        }
        if (this.p2.state !== 'hurt' && this.p2.state !== 'attack' && 
            this.p2.state !== 'heavy' && this.p2.state !== 'skill' &&
            this.p2.state !== 'ultra') {
            const p2Keys = InputManager.playerKeys.p2;
            if (!p2Keys.left && !p2Keys.right) {
                this.p2.facing = this.p1.x > this.p2.x ? 1 : -1;
            }
        }

        // 暂停检测
        if (InputManager.wasJustPressed('p1', 'up') === false && 
            InputManager.wasJustPressed('p2', 'up') === false) {
            // 通过UI按钮暂停
        }

        // 更新UI
        this._updateUI();
        
        // 清除justPressed
        InputManager.clearJustPressed();
    }

    _checkCollisions() {
        // 攻击hitbox
        if (this.p1.getHitbox().active) {
            const hit = this.p1.checkAttackVs(this.p2);
            if (hit) this.cameraShake = 8;
        }
        if (this.p2.getHitbox().active) {
            const hit = this.p2.checkAttackVs(this.p1);
            if (hit) this.cameraShake = 8;
        }

        // 技能投射物
        if (this.p1.currentSkillProjectiles.length > 0) {
            const hit = this.p1.checkProjectileVs(this.p2);
            if (hit) this.cameraShake = 5;
        }
        if (this.p2.currentSkillProjectiles.length > 0) {
            const hit = this.p2.checkProjectileVs(this.p1);
            if (hit) this.cameraShake = 5;
        }

        // 角色互相碰撞（推开）
        if (!this.p1.isDashing && !this.p2.isDashing) {
            const minDist = 50;
            const diff = this.p2.x - this.p1.x;
            const dist = Math.abs(diff);
            if (dist < minDist) {
                const push = (minDist - dist) / 2;
                if (this.p1.state !== 'attack' && this.p1.state !== 'skill' && this.p1.state !== 'ultra') {
                    this.p1.x -= push * Math.sign(diff);
                }
                if (this.p2.state !== 'attack' && this.p2.state !== 'skill' && this.p2.state !== 'ultra') {
                    this.p2.x += push * Math.sign(diff);
                }
            }
        }
    }

    _winRound(winner) {
        if (this.gameState !== 'battle') return;
        
        this.wins[winner]++;
        
        const winnerChar = winner === 'p1' ? this.p1 : this.p2;
        winnerChar.state = 'win';
        winnerChar.stateTime = 0;
        winnerChar.hurtboxActive = false;
        
        setTimeout(() => {
            if (this.wins[winner] >= 2) {
                // 结束整个比赛
                this._endMatch(winner);
            } else {
                this.round++;
                this._setupRound();
            }
        }, 2000);
    }

    _roundEnd() {
        // 时间耗尽，按血量判定
        if (this.p1.hp > this.p2.hp) {
            this._winRound('p1');
        } else if (this.p2.hp > this.p1.hp) {
            this._winRound('p2');
        } else {
            // 平局 - 随机
            this._winRound(Math.random() < 0.5 ? 'p1' : 'p2');
        }
    }

    _endMatch(winner) {
        this.gameState = 'result';
        AudioManager.stopBGM();
        AudioManager.playSFX('win');
        
        const resultScreen = document.getElementById('result-screen');
        const resultTitle = document.getElementById('result-title');
        const winnerInfo = document.getElementById('winner-info');
        const roundResults = document.getElementById('round-results');
        
        const winnerChar = winner === 'p1' ? this.p1 : this.p2;
        const stats = winnerChar.stats;
        
        resultTitle.textContent = winner === 'p1' ? 'P1 胜 利' : 'P2 胜 利';
        resultTitle.style.color = winner === 'p1' ? '#ff2a45' : '#4a9eff';
        
        winnerInfo.innerHTML = `<span style="color:${winner === 'p1' ? '#ff2a45' : '#4a9eff'}">${stats.name}</span> - ${stats.winQuote}`;
        
        roundResults.innerHTML = '';
        for (let i = 1; i < this.maxRounds; i++) {
            const dot = document.createElement('div');
            dot.className = 'round-dot ' + (this.wins.p1 > i - 1 ? 'p1' : (this.wins.p2 > i - 1 ? 'p2' : ''));
            dot.textContent = i;
            roundResults.appendChild(dot);
        }
        
        resultScreen.classList.remove('hidden');
        resultScreen.classList.add('active');
    }

    _showUltraAnnounce() {
        const el = document.getElementById('ultra-announce');
        document.getElementById('ultra-text').textContent = '绯 · 红 · 终 · 结';
        el.classList.remove('hidden');
        setTimeout(() => {
            el.classList.add('hidden');
        }, 500);
    }

    _updateUI() {
        // 更新HP条
        document.getElementById('p1-hp').style.width = 
            (this.p1.hp / this.p1.maxHp * 100) + '%';
        document.getElementById('p2-hp').style.width = 
            (this.p2.hp / this.p2.maxHp * 100) + '%';
        
        // 更新能量条
        document.getElementById('p1-energy').style.width = this.p1.energy + '%';
        document.getElementById('p2-energy').style.width = this.p2.energy + '%';
        
        // 更新名字
        document.getElementById('p1-name').textContent = this.p1.stats.name;
        document.getElementById('p2-name').textContent = this.p2.stats.name;
        
        // 计时器
        const timerEl = document.getElementById('battle-timer');
        const time = Math.ceil(this.timer);
        timerEl.textContent = time;
        timerEl.classList.toggle('warning', time <= 10);
        
        // 回合
        document.getElementById('round-indicator').textContent = 
            `第 ${this.round} 回合 · ${this.wins.p1}:${this.wins.p2}`;
    }

    render() {
        const ctx = this.ctx;
        
        // 清屏
        ctx.clearRect(0, 0, this.baseW, this.baseH);
        
        // 背景
        StageManager.render(ctx, this.baseW, this.baseH);
        
        // 相机震动
        const shakeX = this.cameraShake > 0 ? MathUtils.rand(-this.cameraShake, this.cameraShake) : 0;
        const shakeY = this.cameraShake > 0 ? MathUtils.rand(-this.cameraShake, this.cameraShake) : 0;
        
        // 绘制特效层（在角色后面的）
        ctx.save();
        ctx.translate(shakeX, shakeY);
        EffectManager.render(ctx);
        ctx.restore();
        
        // 绘制角色
        ctx.save();
        ctx.translate(shakeX, shakeY);
        this.p1.draw(ctx, 0);
        this.p2.draw(ctx, 0);
        ctx.restore();
        
        // 暗角
        const vignette = ctx.createRadialGradient(
            this.baseW / 2, this.baseH / 2, this.baseW * 0.3,
            this.baseW / 2, this.baseH / 2, this.baseW * 0.7
        );
        vignette.addColorStop(0, 'rgba(0,0,0,0)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, this.baseW, this.baseH);

        // 暂停时渲染暂停覆盖
        if (this._paused) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, this.baseW, this.baseH);
        }
    }

    pause() {
        this._paused = true;
        this.gameState = 'paused';
        AudioManager.stopBGM();
    }

    resume() {
        this._paused = false;
        this.gameState = 'battle';
        const stage = StageManager.stages[this.selectedStage];
        AudioManager.playBGM(stage.bgm);
        this.lastTime = performance.now();
        this._runLoop();
    }

    quit() {
        this._loopRunning = false;
        this.gameState = 'menu';
        AudioManager.stopBGM();
        EffectManager.clear();
    }
}

/* === js/main.js === */
const GameApp = {
    game: null,
    selectedP1: 0,
    selectedP2: 1,
    selectedStage: 0,
    portraitCanvases: {},
    cpuMode: false,

    init: function() {
        this.game = new Game(document.getElementById('game-canvas'));
        InputManager.init();
        AudioManager.init();
        
        this._setupMenu();
        this._setupSelect();
        this._setupStageSelect();
        this._setupBattle();
        
        this._hideAllScreens();
        this._showScreen('menu-screen');
    },

    _hideAllScreens: function() {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active');
        });
    },

    _showScreen: function(id) {
        this._hideAllScreens();
        const screen = document.getElementById(id);
        if (screen) screen.classList.add('active');
    },

    _setupMenu: function() {
        document.querySelectorAll('#menu-screen .menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                if (action === 'start-cpu') {
                    this.cpuMode = true;
                    this._showScreen('select-screen');
                    this._renderCharacterCards();
                } else if (action === 'start-2p') {
                    this.cpuMode = false;
                    this._showScreen('select-screen');
                    this._renderCharacterCards();
                } else if (action === 'about') {
                    document.getElementById('about-screen').classList.add('active');
                }
            });
        });

        document.querySelector('[data-action="about-close"]')?.addEventListener('click', () => {
            document.getElementById('about-screen').classList.remove('active');
        });
    },

    _renderCharacterCards: function() {
        const grid = document.querySelector('.character-grid');
        grid.innerHTML = '';
        
        for (let i = 0; i < 6; i++) {
            const stats = SpriteFactory.getCharacterStats(i);
            const card = document.createElement('div');
            card.className = 'char-card';
            card.dataset.charId = i;
            
            const charType = CHARACTERS[i];
            const styleClass = charType.colorStyle === 'color' ? 'color-char' : 'manga-char';
            
            card.innerHTML = `
                <div class="char-portrait">
                    <canvas data-portrait="${i}" width="180" height="240" class="${styleClass}"></canvas>
                </div>
                <div class="char-info">
                    <div class="char-name">${stats.name}</div>
                    <div class="char-type">${stats.subtitle} · ${stats.type}</div>
                </div>
            `;
            
            card.addEventListener('click', () => this._selectCharacter(i, card));
            grid.appendChild(card);
            
            // 渲染立绘
            requestAnimationFrame(() => {
                const canvas = card.querySelector('canvas[data-portrait]');
                this._renderPortrait(canvas, i);
            });
        }

        this._updateConfirmButton();
    },

    _renderPortrait: function(canvas, type) {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1a1a24';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 背景渐变
        const grad = ctx.createRadialGradient(
            canvas.width / 2, canvas.height * 0.4, 20,
            canvas.width / 2, canvas.height * 0.4, canvas.width * 0.8
        );
        
        const stage = CHARACTERS[type];
        if (stage.colorStyle === 'color') {
            grad.addColorStop(0, 'rgba(255,200,220,0.3)');
            grad.addColorStop(1, 'rgba(100,50,80,0)');
        } else {
            grad.addColorStop(0, 'rgba(100,30,40,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 绘制角色立绘 (全身)
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height - 30);
        ctx.scale(0.75, 0.75);
        SpriteFactory.drawCharacter(type, 'idle', 15, ctx, { facing: 1 });
        ctx.restore();
    },

    _selectCharacter: function(id, card) {
        const p1Active = document.getElementById('p1-indicator').classList.contains('active');
        
        if (p1Active) {
            this.selectedP1 = id;
            document.getElementById('p1-indicator').classList.remove('active');
            document.getElementById('p2-indicator').classList.add('active');
            
            document.querySelectorAll('.char-card').forEach(c => {
                c.classList.remove('selected-p1', 'selected-p2');
            });
            card.classList.add('selected-p1');
        } else {
            if (id === this.selectedP1) {
                // 不允许相同角色
                return;
            }
            this.selectedP2 = id;
            document.getElementById('p2-indicator').classList.remove('active');
            
            document.querySelectorAll('.char-card').forEach((c, idx) => {
                c.classList.remove('selected-p2');
                if (idx === this.selectedP2) c.classList.add('selected-p2');
            });
        }
        
        this._updateConfirmButton();
    },

    _updateConfirmButton: function() {
        const btn = document.getElementById('confirm-select');
        if (btn) {
            btn.disabled = (this.selectedP1 === this.selectedP2);
        }
    },

    _setupSelect: function() {
        // 重置选人界面时重置状态
        document.getElementById('back-menu')?.addEventListener('click', () => {
            this._hideAllScreens();
            document.getElementById('menu-screen').classList.add('active');
        });

        document.getElementById('confirm-select')?.addEventListener('click', () => {
            if (this.selectedP1 === this.selectedP2) return;
            this._showScreen('stage-screen');
            this._renderStageCards();
        });
    },

    _renderStageCards: function() {
        const grid = document.querySelector('.stage-grid');
        grid.innerHTML = '';
        
        StageManager.stages.forEach((stage, i) => {
            const card = document.createElement('div');
            card.className = 'stage-card';
            card.dataset.stageId = i;
            
            card.innerHTML = `
                <canvas class="stage-preview" width="300" height="170"></canvas>
                <div class="stage-name">${stage.name}</div>
            `;
            
            card.addEventListener('click', () => {
                document.querySelectorAll('.stage-card').forEach(c => {
                    c.classList.remove('selected');
                });
                card.classList.add('selected');
                this.selectedStage = i;
            });
            
            grid.appendChild(card);
            
            // 预览
            requestAnimationFrame(() => {
                const canvas = card.querySelector('.stage-preview');
                StageManager.createPreview(i, canvas);
            });
        });

        // 默认选第一个
        document.querySelector('.stage-card')?.classList.add('selected');
        this.selectedStage = 0;
    },

    _setupStageSelect: function() {
        document.getElementById('back-select')?.addEventListener('click', () => {
            this._showScreen('select-screen');
            this._renderCharacterCards();
        });

        document.getElementById('confirm-stage')?.addEventListener('click', () => {
            this._startBattle();
        });
    },

    _setupBattle: function() {
        // 暂停/继续
        document.getElementById('pause-btn')?.addEventListener('click', () => {
            if (this.game.gameState === 'battle') {
                this.game.pause();
                document.getElementById('pause-screen').classList.add('active');
            }
        });

        document.querySelectorAll('#pause-screen .menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                if (action === 'resume') {
                    document.getElementById('pause-screen').classList.remove('active');
                    this.game.resume();
                } else if (action === 'restart') {
                    document.getElementById('pause-screen').classList.remove('active');
                    this._startBattle();
                } else if (action === 'quit') {
                    document.getElementById('pause-screen').classList.remove('active');
                    this.game.quit();
                    EffectManager.clear();
                    this._hideAllScreens();
                    document.getElementById('menu-screen').classList.add('active');
                }
            });
        });

        document.querySelectorAll('#result-screen .menu-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                if (action === 'rematch') {
                    document.getElementById('result-screen').classList.remove('active');
                    this._startBattle();
                } else if (action === 'result-quit') {
                    document.getElementById('result-screen').classList.remove('active');
                    this.game.quit();
                    EffectManager.clear();
                    this._hideAllScreens();
                    document.getElementById('menu-screen').classList.add('active');
                }
            });
        });
    },

    _startBattle: function() {
        this.game.selectedP1 = this.selectedP1;
        this.game.selectedP2 = this.selectedP2;
        this.game.selectedStage = this.selectedStage;

        this._hideAllScreens();
        const battleScreen = document.getElementById('battle-screen');
        battleScreen.classList.add('active');

        if (this.cpuMode) {
            battleScreen.classList.add('cpu-mode');
        } else {
            battleScreen.classList.remove('cpu-mode');
        }

        this._createBattlePortraits();
        EffectManager.clear();
        this.game.startBattle(this.selectedP1, this.selectedP2, this.selectedStage);
    },

    _createBattlePortraits: function() {
        ['p1-portrait', 'p2-portrait'].forEach((id, idx) => {
            const container = document.getElementById(id);
            const canvas = document.createElement('canvas');
            canvas.width = 56;
            canvas.height = 56;
            const type = idx === 0 ? this.selectedP1 : this.selectedP2;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, 56, 56);
            ctx.save();
            ctx.translate(28, 50);
            ctx.scale(0.25, 0.25);
            SpriteFactory.drawCharacter(type, 'idle', 0, ctx, { facing: 1 });
            ctx.restore();
            container.innerHTML = '';
            container.appendChild(canvas);
        });
    },

    // 暂停快捷键 (ESC)
    setupKeyboardShortcuts: function() {
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && this.game && this.game.gameState === 'battle') {
                this.game.pause();
                document.getElementById('pause-screen').classList.add('active');
            }
        });
    }
};

// 启动
window.addEventListener('DOMContentLoaded', () => {
    GameApp.init();
    GameApp.setupKeyboardShortcuts();
});
</script>
