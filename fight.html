/* === js/engine/input.js === */
const InputManager = {
    keys: {},
    playerKeys: {
        p1: { up: false, down: false, left: false, right: false, light: false, heavy: false, skill: false, block: false, dash: false, ultra: false },
        p2: { up: false, down: false, left: false, right: false, light: false, heavy: false, skill: false, block: false, dash: false, ultra: false }
    },
    lastPressed: { p1: {}, p2: {} },
    justPressed: { p1: {}, p2: {} },

    init: function() {
        window.addEventListener('keydown', (e) => this._onKeyDown(e));
        window.addEventListener('keyup', (e) => this._onKeyUp(e));
        this._setupVirtualControls();
    },

    _onKeyDown: function(e) {
        const map = this._getKeyMap(e.code);
        if (map) {
            const { player, action } = map;
            if (!this.playerKeys[player][action]) {
                this.justPressed[player][action] = true;
            }
            this.playerKeys[player][action] = true;
            this.lastPressed[player][action] = Date.now();
            e.preventDefault();
        }
    },

    _onKeyUp: function(e) {
        const map = this._getKeyMap(e.code);
        if (map) {
            const { player, action } = map;
            this.playerKeys[player][action] = false;
            e.preventDefault();
        }
    },

    _getKeyMap: function(code) {
        const map = {
            // P1 - WASD + 轻/重/技/防/闪 = J/K/L/U/I
            'KeyW': { player: 'p1', action: 'up' },
            'KeyS': { player: 'p1', action: 'down' },
            'KeyA': { player: 'p1', action: 'left' },
            'KeyD': { player: 'p1', action: 'right' },
            'KeyJ': { player: 'p1', action: 'light' },
            'KeyK': { player: 'p1', action: 'heavy' },
            'KeyL': { player: 'p1', action: 'skill' },
            'KeyU': { player: 'p1', action: 'block' },
            'KeyI': { player: 'p1', action: 'dash' },
            'KeyO': { player: 'p1', action: 'ultra' },
            // P2 - 方向键 + 1/2/3/4/5/6
            'ArrowUp': { player: 'p2', action: 'up' },
            'ArrowDown': { player: 'p2', action: 'down' },
            'ArrowLeft': { player: 'p2', action: 'left' },
            'ArrowRight': { player: 'p2', action: 'right' },
            'Digit1': { player: 'p2', action: 'light' },
            'Digit2': { player: 'p2', action: 'heavy' },
            'Digit3': { player: 'p2', action: 'skill' },
            'Digit4': { player: 'p2', action: 'block' },
            'Digit5': { player: 'p2', action: 'dash' },
            'Digit6': { player: 'p2', action: 'ultra' }
        };
        return map[code];
    },

    _setupVirtualControls: function() {
        const buttons = Array.from(document.querySelectorAll('[data-key]'));
        buttons.forEach(btn => {
            const parts = btn.dataset.key.split(':');
            btn._player = parts[0];
            btn._action = parts[1];

            // 桌面端鼠标支持
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                this._pressBtn(btn, true);
            });
            btn.addEventListener('mouseup', () => this._pressBtn(btn, false));
            btn.addEventListener('mouseleave', () => this._pressBtn(btn, false));
        });

        // 触摸：统一手势处理，支持手指滑动到按钮上 + 多点触控
        const activeTouches = {}; // touch.identifier -> btn

        const findBtn = (x, y) => {
            const el = document.elementFromPoint(x, y);
            if (el && el.dataset && el.dataset.key !== undefined) return el;
            return null;
        };

        const handleTouchStart = (e) => {
            let handled = false;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const btn = findBtn(t.clientX, t.clientY);
                if (btn) {
                    handled = true;
                    this._pressBtn(btn, true);
                    activeTouches[t.identifier] = btn;
                }
            }
            if (handled) e.preventDefault();
        };

        const handleTouchMove = (e) => {
            let handled = false;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const btn = findBtn(t.clientX, t.clientY);
                const prev = activeTouches[t.identifier];
                if (btn !== prev) {
                    handled = true;
                    if (prev) this._pressBtn(prev, false);
                    if (btn) this._pressBtn(btn, true);
                    activeTouches[t.identifier] = btn;
                }
            }
            if (handled) e.preventDefault();
        };

        const handleTouchEnd = (e) => {
            let handled = false;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const btn = activeTouches[t.identifier];
                if (btn) {
                    handled = true;
                    this._pressBtn(btn, false);
                }
                delete activeTouches[t.identifier];
            }
            if (handled) e.preventDefault();
        };

        document.addEventListener('touchstart', handleTouchStart, { passive: false });
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd, { passive: false });
        document.addEventListener('touchcancel', handleTouchEnd, { passive: false });
    },

    _pressBtn: function(btn, down) {
        if (!btn || !btn._player) return;
        const player = btn._player;
        const action = btn._action;
        if (down) {
            if (!this.playerKeys[player][action]) {
                this.justPressed[player][action] = true;
            }
            this.playerKeys[player][action] = true;
            btn.classList.add('pressed');
        } else {
            this.playerKeys[player][action] = false;
            btn.classList.remove('pressed');
        }
    },

    isPressed: function(player, action) {
        return this.playerKeys[player][action];
    },

    wasJustPressed: function(player, action) {
        const result = this.justPressed[player][action];
        if (result) this.justPressed[player][action] = false;
        return result;
    },

    clearJustPressed: function() {
        this.justPressed = { p1: {}, p2: {} };
    },

    getPlayerInput: function(player) {
        return this.playerKeys[player];
    }
};

/* === js/engine/audio.js === */
const AudioManager = {
    ctx: null,
    bgmGain: null,
    sfxGain: null,
    currentBgm: null,
    bgmInterval: null,
    muted: false,

    init: function() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.bgmGain = this.ctx.createGain();
            this.sfxGain = this.ctx.createGain();
            this.bgmGain.gain.value = 0.3;
            this.sfxGain.gain.value = 0.5;
            this.bgmGain.connect(this.ctx.destination);
            this.sfxGain.connect(this.ctx.destination);
        } catch (e) {
            console.warn('Audio not supported:', e);
        }
    },

    _ensureCtx: function() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },

    setMuted: function(m) {
        this.muted = m;
        if (this.bgmGain) this.bgmGain.gain.value = m ? 0 : 0.3;
        if (this.sfxGain) this.sfxGain.gain.value = m ? 0 : 0.5;
    },

    // ===== BGM =====
    playBGM: function(type) {
        this._ensureCtx();
        this.stopBGM();
        
        if (!this.ctx || this.muted) return;
        
        const ctx = this.ctx;
        const melody = this._getBGMPattern(type);
        let step = 0;
        const stepTime = 0.28;

        const playNote = () => {
            if (this.muted || !this.ctx) return;
            
            const note = melody[step % melody.length];
            const bassFreq = this._noteFreq(note.bass);
            const leadFreq = this._noteFreq(note.lead);
            
            // 低音
            if (bassFreq) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = bassFreq / 2;
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + stepTime * 0.8);
                osc.connect(gain);
                gain.connect(this.bgmGain);
                osc.start();
                osc.stop(ctx.currentTime + stepTime);
            }

            // 主旋律
            if (leadFreq) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = leadFreq;
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + stepTime * 0.6);
                osc.connect(gain);
                gain.connect(this.bgmGain);
                osc.start();
                osc.stop(ctx.currentTime + stepTime);
            }

            // 鼓点
            if (note.drum) {
                this._playKick(ctx.currentTime);
            }
            
            step++;
        };

        playNote();
        this.bgmInterval = setInterval(playNote, stepTime * 1000);
    },

    stopBGM: function() {
        if (this.bgmInterval) {
            clearInterval(this.bgmInterval);
            this.bgmInterval = null;
        }
    },

    _getBGMPattern: function(type) {
        const rock = [
            { bass: 'C2', lead: null, drum: true },
            { bass: 'G2', lead: 'C4', drum: false },
            { bass: 'A2', lead: null, drum: true },
            { bass: 'E2', lead: 'D4', drum: false },
            { bass: 'C2', lead: 'E4', drum: true },
            { bass: 'G2', lead: null, drum: false },
            { bass: 'F2', lead: 'F4', drum: true },
            { bass: 'G2', lead: 'C4', drum: false }
        ];
        
        const anime = [
            { bass: 'E3', lead: 'E5', drum: true },
            { bass: 'A2', lead: 'G4', drum: false },
            { bass: 'C3', lead: 'C5', drum: true },
            { bass: 'G2', lead: 'E4', drum: false },
            { bass: 'D3', lead: 'D5', drum: true },
            { bass: 'A2', lead: 'B4', drum: false },
            { bass: 'G2', lead: 'G4', drum: true },
            { bass: 'A2', lead: 'C5', drum: false }
        ];

        const dark = [
            { bass: 'D2', lead: null, drum: true },
            { bass: 'D2', lead: 'D4', drum: false },
            { bass: 'G2', lead: null, drum: true },
            { bass: 'F2', lead: 'A3', drum: false },
            { bass: 'D2', lead: 'D4', drum: true },
            { bass: 'G2', lead: null, drum: false },
            { bass: 'E2', lead: 'E4', drum: true },
            { bass: 'G2', lead: null, drum: false }
        ];

        return type === 'color' ? anime : (type === 'dark' ? dark : rock);
    },

    _noteFreq: function(note) {
        if (!note) return null;
        const map = {
            'C2': 65.4, 'D2': 73.4, 'E2': 82.4, 'F2': 87.3, 'G2': 98.0, 'A2': 110.0, 'B2': 123.5,
            'C3': 130.8, 'D3': 146.8, 'E3': 164.8, 'F3': 174.6, 'G3': 196.0, 'A3': 220.0, 'B3': 246.9,
            'C4': 261.6, 'D4': 293.7, 'E4': 329.6, 'F4': 349.2, 'G4': 392.0, 'A4': 440.0, 'B4': 493.9,
            'C5': 523.2, 'D5': 587.3, 'E5': 659.2, 'F5': 698.4, 'G5': 783.9
        };
        return map[note] || 0;
    },

    _playKick: function(time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
        osc.connect(gain);
        gain.connect(this.bgmGain);
        osc.start(time);
        osc.stop(time + 0.16);
    },

    // ===== SFX =====
    playSFX: function(type, opts = {}) {
        this._ensureCtx();
        if (!this.ctx || this.muted) return;
        const time = this.ctx.currentTime;

        switch(type) {
            case 'hit_light':
                this._hitSound(time, 'punch', 0.12);
                break;
            case 'hit_heavy':
                this._hitSound(time, 'bash', 0.2);
                break;
            case 'hit_skill':
                this._skillSound(time);
                break;
            case 'block':
                this._blockSound(time);
                break;
            case 'dash':
                this._dashSound(time);
                break;
            case 'jump':
                this._jumpSound(time);
                break;
            case 'land':
                this._landSound(time);
                break;
            case 'dagger_slash':
                this._slashSound(time);
                break;
            case 'magic':
                this._magicSound(time);
                break;
            case 'ultra':
                this._ultraSound(time);
                break;
            case 'knockdown':
                this._knockdownSound(time);
                break;
            case 'win':
                this._winSound(time);
                break;
            case 'countdown':
                this._countdownSound(time);
                break;
            case 'announce':
                this._announceSound(time);
                break;
        }
    },

    _hitSound: function(time, type, dur) {
        const ctx = this.ctx;
        const noise = ctx.createBufferSource();
        const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < data.length; i++) {
            const t = i / data.length;
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2);
        }
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = type === 'bash' ? 'lowpass' : 'bandpass';
        filter.frequency.value = type === 'bash' ? 400 : 1200;
        filter.Q.value = type === 'bash' ? 2 : 1;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(type === 'bash' ? 0.4 : 0.25, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.sfxGain);
        noise.start(time);
        noise.stop(time + dur);

        if (type === 'bash') {
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + dur);
            oscGain.gain.setValueAtTime(0.15, time);
            oscGain.gain.exponentialRampToValueAtTime(0.001, time + dur);
            osc.connect(oscGain);
            oscGain.connect(this.sfxGain);
            osc.start(time);
            osc.stop(time + dur);
        }
    },

    _skillSound: function(time) {
        const ctx = this.ctx;
        for (let i = 0; i < 5; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + i * 100, time + i * 0.03);
            osc.frequency.exponentialRampToValueAtTime(800 + i * 200, time + i * 0.03 + 0.15);
            gain.gain.setValueAtTime(0.2, time + i * 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, time + i * 0.03 + 0.15);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(time + i * 0.03);
            osc.stop(time + i * 0.03 + 0.15);
        }
    },

    _blockSound: function(time) {
        const ctx = this.ctx;
        const noise = ctx.createBufferSource();
        const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            data[i] = (Math.random() * 2 - 1) * (Math.sin(i * 0.3) * 0.5 + 0.5);
        }
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 3000;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.15, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.sfxGain);
        noise.start(time);
        noise.stop(time + 0.08);
    },

    _dashSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, time);
        osc.frequency.exponentialRampToValueAtTime(200, time + 0.15);
        gain.gain.setValueAtTime(0.15, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 0.15);
    },

    _jumpSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, time);
        osc.frequency.exponentialRampToValueAtTime(600, time + 0.12);
        gain.gain.setValueAtTime(0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 0.12);
    },

    _landSound: function(time) {
        const ctx = this.ctx;
        const noise = ctx.createBufferSource();
        const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        }
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 500;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.2, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.sfxGain);
        noise.start(time);
        noise.stop(time + 0.1);
    },

    _slashSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1800, time);
        osc.frequency.exponentialRampToValueAtTime(200, time + 0.12);
        gain.gain.setValueAtTime(0.2, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 0.12);
    },

    _magicSound: function(time) {
        const ctx = this.ctx;
        for (let i = 0; i < 3; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500 + i * 150, time);
            osc.frequency.linearRampToValueAtTime(300 + i * 100, time + 0.3);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(time);
            osc.stop(time + 0.3);
        }
    },

    _ultraSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, time);
        osc.frequency.linearRampToValueAtTime(2000, time + 0.5);
        gain.gain.setValueAtTime(0.05, time);
        gain.gain.linearRampToValueAtTime(0.4, time + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 1.5);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 1.5);

        const noise = ctx.createBufferSource();
        const buffer = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 0.5);
        }
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2000;
        const nGain = ctx.createGain();
        nGain.gain.setValueAtTime(0.05, time);
        nGain.gain.linearRampToValueAtTime(0.3, time + 0.3);
        nGain.gain.exponentialRampToValueAtTime(0.001, time + 1.5);
        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.sfxGain);
        noise.start(time);
        noise.stop(time + 1.5);
    },

    _knockdownSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, time);
        osc.frequency.exponentialRampToValueAtTime(80, time + 0.4);
        gain.gain.setValueAtTime(0.25, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 0.4);
    },

    _winSound: function(time) {
        const notes = ['C5', 'E5', 'G5', 'C6'];
        notes.forEach((note, i) => {
            const ctx = this.ctx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = this._noteFreq(note);
            gain.gain.setValueAtTime(0, time + i * 0.12);
            gain.gain.linearRampToValueAtTime(0.15, time + i * 0.12 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, time + i * 0.12 + 0.3);
            osc.connect(gain);
            gain.connect(this.sfxGain);
            osc.start(time + i * 0.12);
            osc.stop(time + i * 0.12 + 0.3);
        });
    },

    _countdownSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = 440;
        gain.gain.setValueAtTime(0.1, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 0.1);
    },

    _announceSound: function(time) {
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, time);
        osc.frequency.linearRampToValueAtTime(600, time + 0.3);
        gain.gain.setValueAtTime(0.15, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(time);
        osc.stop(time + 0.3);
    }
};

/* === js/engine/effects.js === */
const EffectManager = {
    effects: [],
    particles: [],

    createHitEffect: function(x, y, type, dir) {
        const configs = {
            punch: { color: '#ff2a45', count: 8, speed: 8, life: 0.3, size: 6 },
            bash: { color: '#ff6b00', count: 14, speed: 12, life: 0.4, size: 8 },
            slash: { color: '#ffffff', count: 10, speed: 10, life: 0.25, size: 5 },
            dagger: { color: '#00e5ff', count: 12, speed: 14, life: 0.35, size: 6 },
            magic: { color: '#aa44ff', count: 16, speed: 10, life: 0.5, size: 7 },
            paw: { color: '#ff8a9a', count: 10, speed: 9, life: 0.3, size: 6 }
        };
        const cfg = configs[type] || configs.punch;
        
        for (let i = 0; i < cfg.count; i++) {
            const angle = dir + MathUtils.rand(-1, 1) * 0.6;
            const speed = MathUtils.rand(cfg.speed * 0.5, cfg.speed);
            this.particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed + MathUtils.rand(-2, 0),
                life: cfg.life,
                maxLife: cfg.life,
                size: MathUtils.rand(cfg.size * 0.5, cfg.size),
                color: cfg.color,
                type: 'particle'
            });
        }

        // 冲击波
        this.effects.push({
            x: x, y: y,
            radius: 0,
            maxRadius: type === 'bash' ? 60 : 40,
            life: 0.25,
            maxLife: 0.25,
            color: cfg.color,
            type: 'shockwave'
        });

        // 斩击光痕
        if (type === 'slash' || type === 'dagger' || type === 'punch') {
            this.effects.push({
                x: x, y: y,
                dir: dir,
                life: 0.15,
                maxLife: 0.15,
                color: cfg.color,
                type: 'slash',
                length: type === 'bash' ? 80 : 50
            });
        }
    },

    createBlockEffect: function(x, y, dir) {
        this.effects.push({
            x: x, y: y,
            radius: 0,
            maxRadius: 50,
            life: 0.3,
            maxLife: 0.3,
            color: '#4a9eff',
            type: 'block'
        });
    },

    createDashEffect: function(x, y, dir, count = 6) {
        for (let i = 0; i < count; i++) {
            this.particles.push({
                x: x - dir * i * 5,
                y: y + MathUtils.rand(-15, 15),
                vx: -dir * MathUtils.rand(2, 4),
                vy: MathUtils.rand(-1, 1),
                life: 0.25,
                maxLife: 0.25,
                size: MathUtils.rand(3, 6),
                color: 'rgba(255,255,255,0.7)',
                type: 'particle'
            });
        }
    },

    createSkillEffect: function(x, y, type, dir) {

            case 'bullet':

                    this.particles.push({
                        x: x,

                    });

                        life: 0.6,
                        maxLife: 0.6,

                        color: '#00e5ff',
                        type: 'projectile'
                    });

                    });

            case 'fist_barrage':

                        x: x,
                        y: y,
                        vx: Math.cos(angle) * MathUtils.rand(8, 14),
                        vy: Math.sin(angle) * MathUtils.rand(8, 14),
                        life: 0.25,
                        maxLife: 0.25,
                        size: MathUtils.rand(4, 7),
                        color: '#ff2a45',
                        type: 'particle'
                    });
                }

            case 'grapple':
                this.effects.push({

            default:

                    this.particles.push({

                        vy: Math.sin(angle) * MathUtils.rand(4, 10),

    createUltraEffect: function(x, y, type, dir) {
        // 爆炸式粒子
        for (let i = 0; i < 40; i++) {
            const angle = MathUtils.rand(0, Math.PI * 2);
            const speed = MathUtils.rand(5, 20);
            this.particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 0.8,
                maxLife: 0.8,
                size: MathUtils.rand(4, 10),
                color: ['#ff2a45', '#ff6b00', '#ffee00', '#ffffff'][MathUtils.randInt(0, 3)],
                type: 'particle'
            });
        }

        // 大型冲击波
        for (let i = 0; i < 3; i++) {
            this.effects.push({
                x: x, y: y,
                radius: 0,
                maxRadius: 120 + i * 40,
                life: 0.5 + i * 0.1,
                maxLife: 0.5 + i * 0.1,
                color: i === 0 ? '#ffffff' : '#ff2a45',
                type: 'shockwave',
                delay: i * 0.1
            });
        }
    },

    createFloatText: function(x, y, text, color) {
        this.effects.push({
            x: x,
            y: y,
            text: text,
            color: color || '#ff2a45',
            vy: -2,
            life: 1.0,
            maxLife: 1.0,
            size: text.length > 2 ? 28 : 20,
            type: 'text'
        });
    },

    createKnockdownEffect: function(x, y) {
        // 尘土 + 冲击波
        for (let i = 0; i < 8; i++) {
            this.particles.push({
                x: x + MathUtils.rand(-30, 30),
                y: y,
                vx: MathUtils.rand(-4, 4),
                vy: MathUtils.rand(-8, -2),
                life: 0.4,
                maxLife: 0.4,
                size: MathUtils.rand(5, 10),
                color: 'rgba(200,200,200,0.7)',
                type: 'particle',
                gravity: 0.3
            });
        }
    },

    update: function(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= dt;
            if (p.gravity) p.vy += p.gravity;
            if (p.type === 'projectile') {
                this.effects.push({
                    x: p.x, y: p.y,
                    radius: p.size * 0.5,
                    maxRadius: p.size,
                    life: 0.15,
                    maxLife: 0.15,
                    color: p.color,
                    type: 'shockwave'
                });
            }
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        for (let i = this.effects.length - 1; i >= 0; i--) {
            const e = this.effects[i];
            if (e.delay && e.delay > 0) {
                e.delay -= dt;
                continue;
            }
            if (e.type === 'shockwave') {
                e.radius = MathUtils.lerp(0, e.maxRadius, 1 - e.life / e.maxLife);
            } else if (e.type === 'text') {
                e.y += e.vy;
                e.vy *= 0.95;
            }
            e.life -= dt;
            if (e.life <= 0) this.effects.splice(i, 1);
        }
    },

    render: function(ctx) {
        // 冲击波
        this.effects.filter(e => e.type === 'shockwave' && (!e.delay || e.delay <= 0)).forEach(e => {
            const alpha = MathUtils.clamp(e.life / e.maxLife, 0, 1);
            ctx.strokeStyle = e.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        });

        // 斩击光痕
        this.effects.filter(e => e.type === 'slash').forEach(e => {
            const alpha = MathUtils.clamp(e.life / e.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 4;
            ctx.shadowColor = e.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            const startX = e.x - Math.cos(e.dir) * e.length;
            const startY = e.y - Math.sin(e.dir) * e.length;
            ctx.moveTo(startX, startY);
            ctx.lineTo(e.x, e.y);
            ctx.stroke();
            ctx.restore();
        });

        // 格挡特效
        this.effects.filter(e => e.type === 'block' && (!e.delay || e.delay <= 0)).forEach(e => {
            const alpha = MathUtils.clamp(e.life / e.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = alpha * 0.6;
            const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.maxRadius);
            grad.addColorStop(0, 'rgba(74,158,255,0.8)');
            grad.addColorStop(0.7, 'rgba(74,158,255,0.2)');
            grad.addColorStop(1, 'rgba(74,158,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.maxRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 粒子
        this.particles.forEach(p => {
            const alpha = MathUtils.clamp(p.life / p.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = alpha;
            if (p.type === 'projectile') {
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
            }
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 浮动文字
        this.effects.filter(e => e.type === 'text').forEach(e => {
            const alpha = MathUtils.clamp(e.life / e.maxLife, 0, 1);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `bold ${e.size}px sans-serif`;
            ctx.fillStyle = e.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.strokeText(e.text, e.x, e.y);
            ctx.fillText(e.text, e.x, e.y);
            ctx.restore();
        });
    },

    clear: function() {
        this.effects = [];
        this.particles = [];
    }
};
