<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>CRIMSON CLASH - 绯红对弈</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    color: #fff;
    touch-action: none;
}

#game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    overflow: hidden;
}

#game-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #111;
    box-shadow: 0 0 60px rgba(200, 30, 40, 0.3);
}

.screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    z-index: 10;
}

.screen.active {
    display: flex;
}

.screen.overlay {
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
}

/* ===== 主菜单 ===== */
#menu-screen {
    background: #0a0a0a;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.menu-bg {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 30% 40%, rgba(180, 20, 30, 0.15), transparent 60%),
        radial-gradient(ellipse at 70% 60%, rgba(30, 40, 100, 0.15), transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
    animation: bgShift 8s ease-in-out infinite alternate;
}

@keyframes bgShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(30deg); }
}

.menu-content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.title-glow {
    margin-bottom: 60px;
    animation: titleFloat 3s ease-in-out infinite;
}

@keyframes titleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.game-title {
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #ff2a45 0%, #ff6b8a 30%, #fff 50%, #ff6b8a 70%, #ff2a45 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255, 42, 69, 0.6));
    text-shadow: none;
    position: relative;
}

.game-title::after {
    content: 'CRIMSON CLASH';
    position: absolute;
    top: 0;
    left: 0;
    background: linear-gradient(135deg, #ff2a45, #ff6b8a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: blur(20px);
    opacity: 0.5;
}

.subtitle {
    font-size: clamp(18px, 3vw, 28px);
    letter-spacing: 0.5em;
    color: #ff2a45;
    margin-top: 10px;
    font-weight: 300;
}

.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
}

.menu-btn {
    padding: 14px 48px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.2em;
    background: linear-gradient(135deg, rgba(255,42,69,0.2), rgba(255,42,69,0.05));
    border: 2px solid #ff2a45;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}

.menu-btn:hover, .menu-btn:active {
    background: linear-gradient(135deg, #ff2a45, #cc1530);
    box-shadow: 0 0 30px rgba(255, 42, 69, 0.6);
    transform: scale(1.05);
}

.menu-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
}

.menu-btn:hover::before {
    left: 100%;
}

.version-tag {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
}

/* ===== 选人界面 ===== */
#select-screen, #stage-screen {
    flex-direction: column;
    background: #0d0d12;
}

.select-bg {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(255,42,69,0.08), transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(100,50,200,0.08), transparent 50%);
}

.stage-select-bg {
    background:
        radial-gradient(ellipse at 50% 50%, rgba(50,100,200,0.1), transparent 60%);
}

.select-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1200px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    height: 100%;
}

.select-header {
    text-align: center;
    margin-bottom: 20px;
}

.select-header h2 {
    font-size: clamp(24px, 4vw, 36px);
    letter-spacing: 0.3em;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,42,69,0.5);
}

.player-indicator {
    margin-top: 12px;
    font-size: 16px;
}

.player-indicator span {
    padding: 6px 20px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    margin: 0 4px;
    transition: all 0.3s;
}

.player-indicator span.active {
    border-color: #ff2a45;
    color: #ff2a45;
    box-shadow: 0 0 15px rgba(255,42,69,0.3);
}

.vs-text {
    color: rgba(255,255,255,0.4) !important;
    border: none !important;
    padding: 0 12px !important;
    font-weight: bold;
}

.character-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 10px;
    overflow-y: auto;
}

@media (max-width: 600px) {
    .character-grid { grid-template-columns: repeat(2, 1fr); }
}

.char-card {
    position: relative;
    aspect-ratio: 3/4;
    background: #1a1a24;
    border: 2px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s ease;
}

.char-card:hover {
    border-color: #ff2a45;
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(255,42,69,0.3);
}

.char-card.selected-p1 {
    border-color: #ff2a45;
    box-shadow: 0 0 25px rgba(255,42,69,0.5);
}

.char-card.selected-p2 {
    border-color: #4a9eff;
    box-shadow: 0 0 25px rgba(74,158,255,0.5);
}

.char-card.selected-p1::before {
    content: 'P1';
    position: absolute;
    top: 8px;
    left: 8px;
    background: #ff2a45;
    color: #fff;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 2px;
    z-index: 5;
}

.char-card.selected-p2::before {
    content: 'P2';
    position: absolute;
    top: 8px;
    left: 8px;
    background: #4a9eff;
    color: #fff;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 2px;
    z-index: 5;
}

.char-portrait {
    width: 100%;
    height: calc(100% - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.char-portrait canvas {
    max-width: 100%;
    max-height: 100%;
}

.char-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    padding: 8px 12px;
}

.char-name {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.1em;
}

.char-type {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
}

/* ===== 场景选择 ===== */
.stage-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 10px;
}

.stage-card {
    position: relative;
    aspect-ratio: 16/9;
    background: #1a1a24;
    border: 2px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s ease;
}

.stage-card:hover {
    border-color: #ff2a45;
    transform: scale(1.02);
}

.stage-card.selected {
    border-color: #ff2a45;
    box-shadow: 0 0 25px rgba(255,42,69,0.5);
}

.stage-preview {
    width: 100%;
    height: 100%;
}

.stage-name {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
}

/* ===== 选择页底部 ===== */
.select-footer {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px 0;
}

.confirm-btn {
    padding: 14px 56px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.3em;
    background: linear-gradient(135deg, #ff2a45, #cc1530);
    border: none;
    color: #fff;
    cursor: pointer;
    clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
    transition: all 0.3s;
}

.confirm-btn:hover {
    box-shadow: 0 0 40px rgba(255,42,69,0.7);
    transform: scale(1.05);
}

.confirm-btn:disabled {
    background: #333;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.back-btn {
    padding: 14px 32px;
    font-size: 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.3s;
}

.back-btn:hover {
    border-color: #fff;
    color: #fff;
}

/* ===== 战斗 HUD ===== */
.hud-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}

.hud-top {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 20px;
}

.player-hud {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 200px;
}

.p2-hud {
    flex-direction: row-reverse;
}

.portrait {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #222;
    border: 2px solid #ff2a45;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.p2-hud .portrait {
    border-color: #4a9eff;
}

.portrait canvas {
    width: 100%;
    height: 100%;
}

.bars {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 140px;
}

.hp-bar-wrapper {
    height: 16px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
}

.hp-bar {
    height: 100%;
    background: linear-gradient(90deg, #ff2a45, #ff6b8a);
    width: 100%;
    transition: width 0.3s ease;
    position: relative;
}

.hp-bar.p2 {
    background: linear-gradient(90deg, #4a9eff, #7ab8ff);
    float: right;
}

.hp-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
}

.energy-bar-wrapper {
    height: 8px;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
}

.energy-bar {
    height: 100%;
    background: linear-gradient(90deg, #ffcc00, #ffee88);
    width: 0%;
    transition: width 0.2s ease;
    box-shadow: 0 0 8px rgba(255,204,0,0.6);
}

.energy-bar.p2 {
    float: right;
}

.player-name {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.1em;
    text-align: center;
    min-width: 80px;
}

.p2-hud .player-name {
    text-align: center;
}

.timer-wrapper {
    text-align: center;
    min-width: 90px;
}

.round-indicator {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
}

.timer {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,42,69,0.8);
    background: rgba(0,0,0,0.6);
    padding: 4px 16px;
    border: 1px solid #ff2a45;
    border-radius: 4px;
}

.timer.warning {
    color: #ff2a45;
    animation: timerPulse 0.5s ease-in-out infinite alternate;
}

@keyframes timerPulse {
    0% { box-shadow: 0 0 10px rgba(255,42,69,0.5); }
    100% { box-shadow: 0 0 25px rgba(255,42,69,1); }
}

.pause-btn {
    position: absolute;
    top: 12px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    pointer-events: auto;
    z-index: 25;
}

/* ===== 虚拟按键 ===== */
.controls-layer {
    position: absolute;
    bottom: 15px;
    display: flex;
    align-items: flex-end;
    gap: 30px;
    pointer-events: auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

.p1-controls {
    left: 20px;
}

.p2-controls {
    right: 20px;
    flex-direction: row-reverse;
}

/* CPU 模式：隐藏 P2 按键，P1 按键区放宽 */
#battle-screen.cpu-mode .p2-controls { display: none; }
#battle-screen.cpu-mode .p1-controls { gap: 20px; }

.dpad {
    position: relative;
    width: 150px;
    height: 150px;
}

.dpad-btn {
    position: absolute;
    width: 48px;
    height: 48px;
    background: rgba(30,30,40,0.85);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    touch-action: none;
}

.dpad-btn:active, .dpad-btn.pressed {
    background: rgba(255,42,69,0.6);
    border-color: #ff2a45;
    color: #fff;
    transform: scale(0.92);
}

.dpad-btn.up { top: 0; left: 51px; }
.dpad-btn.down { bottom: 0; left: 51px; }
.dpad-btn.left { top: 51px; left: 0; }
.dpad-btn.right { top: 51px; right: 0; }

.action-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
}

.act-btn {
    width: 58px;
    height: 58px;
    background: rgba(30,30,40,0.85);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    touch-action: none;
}

.act-btn:active, .act-btn.pressed {
    transform: scale(0.9);
}

.act-btn.light { border-color: #4a9eff; color: #4a9eff; }
.act-btn.light:active { background: #4a9eff; color: #fff; }

.act-btn.heavy { border-color: #ff2a45; color: #ff2a45; }
.act-btn.heavy:active { background: #ff2a45; color: #fff; }

.act-btn.skill { border-color: #ffcc00; color: #ffcc00; }
.act-btn.skill:active { background: #ffcc00; color: #000; }

.act-btn.ultra { border-color: #ff00ff; color: #ff00ff; grid-column: 1; grid-row: 2; }
.act-btn.ultra:active { background: #ff00ff; color: #fff; }

.act-btn.block { border-color: #888; color: #aaa; grid-column: 2; grid-row: 2; }
.act-btn.block:active { background: #888; color: #000; }

.act-btn.dash { border-color: #aa44ff; color: #aa44ff; grid-column: 3; grid-row: 2; }
.act-btn.dash:active { background: #aa44ff; color: #fff; }

/* ===== 暂停/结算/关于面板 ===== */
.pause-panel, .result-panel, .about-panel {
    background: #1a1a24;
    border: 1px solid rgba(255,42,69,0.5);
    padding: 40px 50px;
    border-radius: 8px;
    text-align: center;
    min-width: 320px;
    box-shadow: 0 0 60px rgba(255,42,69,0.2);
}

.pause-panel h3, .result-panel h3, .about-panel h3 {
    font-size: 28px;
    margin-bottom: 30px;
    letter-spacing: 0.2em;
    color: #ff2a45;
}

.pause-panel .menu-btn, .result-panel .menu-btn {
    display: block;
    margin: 12px auto;
    min-width: 200px;
}

.about-panel p {
    margin: 12px 0;
    line-height: 1.8;
    color: rgba(255,255,255,0.8);
}

.about-panel .credit {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    margin-top: 20px;
}

.about-panel .back-btn {
    margin-top: 20px;
}

/* ===== 结算界面 ===== */
.result-panel {
    min-width: 400px;
}

#result-title {
    font-size: 48px !important;
    text-shadow: 0 0 30px rgba(255,42,69,0.8);
}

.result-panel .winner-info {
    font-size: 20px;
    margin: 20px 0;
    letter-spacing: 0.15em;
}

.round-results {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
}

.round-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
}

.round-dot.p1 { background: rgba(255,42,69,0.6); border: 2px solid #ff2a45; }
.round-dot.p2 { background: rgba(74,158,255,0.6); border: 2px solid #4a9eff; }

.result-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 20px;
}

/* ===== 回合/必杀提示 ===== */
.round-announce {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
    text-align: center;
    pointer-events: none;
}

.round-announce.hidden, .ultra-announce.hidden {
    display: none;
}

.round-announce span {
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 900;
    letter-spacing: 0.2em;
    background: linear-gradient(135deg, #fff, #ff2a45);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(255,42,69,0.8));
    animation: announcePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.ultra-announce {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 60;
    text-align: center;
    pointer-events: none;
}

.ultra-announce span {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #ffee00;
    text-shadow: 
        0 0 10px #ff6b00,
        0 0 30px #ff2a00,
        0 0 60px #ff0000;
    animation: ultraFlash 0.5s ease-out;
}

@keyframes announcePop {
    0% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    40% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
}

@keyframes ultraFlash {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; filter: blur(20px); }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; filter: blur(0); }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ===== 滚动条美化 ===== */
::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255,42,69,0.5);
    border-radius: 3px;
}

/* ===== 禁用横屏时虚拟按键 (桌面测试) ===== */
@media (hover: hover) and (pointer: fine) {
    .controls-layer {
        opacity: 0.7;
    }
}

<script>
/* === js/utils/math.js === */
const MathUtils = {
    clamp: function(v, min, max) {
        return Math.max(min, Math.min(max, v));
    },
    lerp: function(a, b, t) {
        return a + (b - a) * t;
    },
    rand: function(min, max) {
        return Math.random() * (max - min) + min;
    },
    randInt: function(min, max) {
        return Math.floor(this.rand(min, max + 1));
    },
    dist: function(x1, y1, x2, y2) {
        return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
    },
    angle: function(x1, y1, x2, y2) {
        return Math.atan2(y2 - y1, x2 - x1);
    },
    easeOutQuad: function(t) {
        return t * (2 - t);
    },
    easeInOutQuad: function(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    },
    rectsOverlap: function(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
    },
    aabb: function(x, y, w, h) {
        return { x, y, w, h };
    }
};

/* === js/utils/color.js === */
const ColorUtils = {
    hexToRgb: function(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
    },
    rgb: function(r, g, b, a) {
        return `rgba(${r},${g},${b},${a !== undefined ? a : 1})`;
    },
    mix: function(c1, c2, t) {
        const a = this.hexToRgb(c1);
        const b = this.hexToRgb(c2);
        return this.rgb(
            Math.round(MathUtils.lerp(a.r, b.r, t)),
            Math.round(MathUtils.lerp(a.g, b.g, t)),
            Math.round(MathUtils.lerp(a.b, b.b, t))
        );
    }
};

/* === js/utils/sprite.js === */
const SpriteFactory = {
    _canvasPool: [],
    
    createCanvas: function(w, h) {
        let c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        return c;
    },

    drawCharacter: function(type, action, frame, ctx, opts = {}) {
        const config = CHARACTERS[type];
        if (!config) return;
        const facing = opts.facing || 1;
        const scale = opts.scale || 1;
        const offsetX = opts.offsetX || 0;
        const offsetY = opts.offsetY || 0;

        ctx.save();
        ctx.translate(offsetX, offsetY);
        if (facing < 0) {
            ctx.scale(-1, 1);
        }
        ctx.scale(scale, scale);

        if (config.colorStyle === 'color') {
            this._drawColoredCharacter(ctx, config, action, frame);
        } else {
            this._drawMangaCharacter(ctx, config, action, frame);
        }

        ctx.restore();
    },

    _getFrameOffset: function(action, frame) {
        const offsets = {
            idle: { x: 0, y: Math.sin(frame * 0.3) * 2 },
            walk: { x: Math.sin(frame * 0.4) * 3, y: Math.abs(Math.sin(frame * 0.4)) * -2 },
            jump: { x: 0, y: frame < 5 ? -frame * 8 : -(10 - frame) * 8 },
            fall: { x: 0, y: 0 },
            attack: { x: 0, y: 0 },
            heavy: { x: 0, y: frame === 4 ? -5 : 0 },
            skill: { x: 0, y: frame < 3 ? -3 : 0 },
            block: { x: 0, y: 0 },
            hurt: { x: frame % 2 === 0 ? -3 : 3, y: frame < 3 ? -2 : 0 },
            dead: { x: 0, y: frame > 5 ? frame - 5 : 0 },
            win: { x: 0, y: Math.sin(frame * 0.2) * 3 }
        };
        return offsets[action] || { x: 0, y: 0 };
    },

    _drawMangaCharacter: function(ctx, config, action, frame) {
        const off = this._getFrameOffset(action, frame);
        ctx.translate(off.x, off.y);

        const ink = '#1a1a1a';
        const paper = '#f0f0f0';
        const accent = config.accent || '#333';
        const hatching = config.hatching || '#666';

        ctx.fillStyle = paper;
        ctx.strokeStyle = ink;
        ctx.lineWidth = 2.2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        this._drawBody(ctx, config, action, frame, ink, paper, hatching);
        this._drawHead(ctx, config, action, frame, ink, paper);
        this._drawOutfit(ctx, config, action, frame, ink, paper, accent, hatching);

        if (action === 'skill' || action === 'heavy') {
            ctx.strokeStyle = '#ff2a45';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(0, -80, 70 + i * 15 + frame * 5, 
                    -Math.PI/4 + i * 0.3, Math.PI/4 + i * 0.3);
                ctx.stroke();
            }
        }
    },

    _drawColoredCharacter: function(ctx, config, action, frame) {
        const off = this._getFrameOffset(action, frame);
        ctx.translate(off.x, off.y);

        const outline = '#3a2a2a';
        const skin = '#fce4d6';
        const hairColor = config.hairColor || '#e8c97a';
        const outfitMain = config.outfitMain || '#f5d5a0';
        const outfitAccent = config.outfitAccent || '#6b8e23';

        ctx.lineWidth = 1.8;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        this._drawColoredBody(ctx, config, action, frame, outline, skin);
        this._drawColoredHead(ctx, config, action, frame, outline, skin, hairColor);
        this._drawColoredOutfit(ctx, config, action, frame, outline, outfitMain, outfitAccent);

        if (action === 'jump') {
            ctx.fillStyle = 'rgba(255,200,220,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 120, 60 + frame * 8, 20 + frame * 3, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    },

    _drawBody(ctx, config, action, frame, ink, paper, hatching) {
        const baseY = 0;
        const legSpread = action === 'walk' ? Math.sin(frame * 0.4) * 15 : (action === 'idle' ? 4 : 0);
        const armAngle = this._getArmAngle(action, frame);
        
        ctx.strokeStyle = ink;
        ctx.fillStyle = paper;

        // 躯干
        ctx.beginPath();
        ctx.moveTo(-22, -60 + baseY);
        ctx.lineTo(-28, 30 + baseY);
        ctx.lineTo(28, 30 + baseY);
        ctx.lineTo(22, -60 + baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 躯干阴影 (网点)
        ctx.fillStyle = 'rgba(0,0,0,0.08)';
        for (let y = -55 + baseY; y < 30 + baseY; y += 4) {
            for (let x = -20; x < 20; x += 8) {
                const alpha = MathUtils.clamp(0.15 - Math.abs(y) * 0.003, 0, 0.15);
                ctx.fillStyle = `rgba(0,0,0,${alpha})`;
                ctx.beginPath();
                ctx.arc(x + (y % 8 === 0 ? 4 : 0), y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 左腿
        ctx.beginPath();
        ctx.moveTo(-10, 30 + baseY);
        ctx.quadraticCurveTo(-15 - legSpread, 70, -18 - legSpread, 110);
        ctx.lineTo(-15 - legSpread, 115);
        ctx.quadraticCurveTo(-10, 70, -5, 30 + baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 右腿
        ctx.beginPath();
        ctx.moveTo(5, 30 + baseY);
        ctx.quadraticCurveTo(15 + legSpread, 70, 18 + legSpread, 110);
        ctx.lineTo(15 + legSpread, 115);
        ctx.quadraticCurveTo(10, 70, 10, 30 + baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 鞋子
        ctx.beginPath();
        ctx.ellipse(-16 - legSpread, 115, 12, 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = ink;
        ctx.fill();
        
        ctx.beginPath();
        ctx.ellipse(16 + legSpread, 115, 12, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 左臂
        ctx.fillStyle = paper;
        ctx.beginPath();
        ctx.moveTo(-22, -50 + baseY);
        const la = armAngle.left;
        ctx.quadraticCurveTo(
            -25 + Math.cos(la) * 25, -20 + Math.sin(la) * 30,
            -30 + Math.cos(la) * 45, 0 + Math.sin(la) * 50
        );
        ctx.lineTo(-25 + Math.cos(la) * 45, 5 + Math.sin(la) * 50);
        ctx.quadraticCurveTo(-22, -15 + baseY, -18, -55 + baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 右臂
        ctx.beginPath();
        ctx.moveTo(22, -50 + baseY);
        const ra = armAngle.right;
        const reach = action === 'attack' ? 1.8 : (action === 'heavy' ? 2.0 : (action === 'skill' ? 1.5 : 1));
        ctx.quadraticCurveTo(
            25 + Math.cos(ra) * 25 * reach, -20 + Math.sin(ra) * 30 * reach,
            30 + Math.cos(ra) * 55 * reach, 0 + Math.sin(ra) * 60 * reach
        );
        ctx.lineTo(25 + Math.cos(ra) * 55 * reach, 5 + Math.sin(ra) * 60 * reach);
        ctx.quadraticCurveTo(22, -15 + baseY, 18, -55 + baseY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 拳头/手
        const handX = 30 + Math.cos(ra) * 55 * reach;
        const handY = 0 + Math.sin(ra) * 60 * reach;
        ctx.fillStyle = ink;
        ctx.beginPath();
        ctx.arc(handX + 3, handY, action === 'attack' || action === 'heavy' ? 10 : 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = paper;
        ctx.beginPath();
        ctx.arc(handX, handY + 2, action === 'attack' || action === 'heavy' ? 7 : 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = ink;
        ctx.stroke();

        // 腿上的网点
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        for (let y = 35; y < 110; y += 3) {
            ctx.beginPath();
            ctx.moveTo(-20, y);
            ctx.lineTo(20, y);
            ctx.lineWidth = 0.3;
            ctx.strokeStyle = 'rgba(0,0,0,0.04)';
            ctx.stroke();
        }
    },

    _getArmAngle(action, frame) {
        let right = 0;
        let left = 0;
        
        switch(action) {
            case 'idle':
                right = Math.sin(frame * 0.1) * 0.05 + 0.3;
                left = Math.sin(frame * 0.1 + Math.PI) * 0.05 - 0.3;
                break;
            case 'walk':
                right = Math.sin(frame * 0.4) * 0.4;
                left = -Math.sin(frame * 0.4) * 0.4;
                break;
            case 'jump':
                right = -0.8;
                left = -0.8;
                break;
            case 'attack':
                right = frame < 4 ? frame * 0.35 : Math.max(0, 4 - frame) * 0.35;
                left = -0.2;
                break;
            case 'heavy':
                right = frame < 3 ? frame * 0.5 : (frame < 5 ? 1.5 - frame * 0.3 : Math.max(0, 5 - frame) * 0.5);
                left = -0.3;
                break;
            case 'skill':
                right = frame < 4 ? frame * 0.25 + 0.3 : Math.max(0, 4 - frame) * 0.25 + 1.0;
                left = -0.5 - frame * 0.1;
                break;
            case 'block':
                right = -1.2;
                left = 1.2;
                break;
            case 'hurt':
                right = -0.5;
                left = 0.5;
                break;
            default:
                right = 0.3;
                left = -0.3;
        }
        return { right, left };
    },

    _drawHead(ctx, config, action, frame, ink, paper) {
        const bob = action === 'walk' ? Math.abs(Math.sin(frame * 0.4)) * 2 : 0;
        const headY = -80 - bob;

        ctx.strokeStyle = ink;
        ctx.fillStyle = paper;
        ctx.lineWidth = 2;

        // 颈部
        ctx.beginPath();
        ctx.moveTo(-8, -65 - bob);
        ctx.lineTo(8, -65 - bob);
        ctx.lineTo(6, headY + 5);
        ctx.lineTo(-6, headY + 5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 头部
        ctx.beginPath();
        ctx.ellipse(0, headY, 24, 28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 头发后层
        this._drawHair(ctx, config, headY, ink, 'back');

        // 眼睛
        ctx.fillStyle = ink;
        if (config.eyePatch === 'left') {
            // 左眼被眼罩遮挡
            ctx.fillRect(-20, headY - 5, 18, 10);
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-8, headY - 3);
            ctx.lineTo(-3, headY - 2);
            ctx.stroke();
            // 右眼
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.ellipse(8, headY - 2, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paper;
            ctx.beginPath();
            ctx.ellipse(9, headY - 3, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (config.eyePatch === 'right') {
            ctx.fillRect(2, headY - 5, 18, 10);
            ctx.beginPath();
            ctx.moveTo(8, headY - 3);
            ctx.lineTo(13, headY - 2);
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.ellipse(-8, headY - 2, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paper;
            ctx.beginPath();
            ctx.ellipse(-7, headY - 3, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 左眼
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.ellipse(-8, headY - 2, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paper;
            ctx.beginPath();
            ctx.ellipse(-7, headY - 3, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            // 右眼
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.ellipse(8, headY - 2, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paper;
            ctx.beginPath();
            ctx.ellipse(9, headY - 3, 1.5, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // 嘴
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        if (action === 'hurt') {
            ctx.moveTo(-3, headY + 10);
            ctx.lineTo(3, headY + 12);
        } else if (action === 'attack' || action === 'heavy') {
            ctx.moveTo(-4, headY + 10);
            ctx.lineTo(0, headY + 13);
            ctx.lineTo(4, headY + 10);
        } else {
            ctx.arc(0, headY + 10, 3, 0, Math.PI);
        }
        ctx.stroke();

        // 头发前层
        this._drawHair(ctx, config, headY, ink, 'front');
    },

    _drawHair(ctx, config, headY, ink, layer) {
        ctx.fillStyle = ink;
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.5;

        if (config.hairStyle === 'short_black') {
            if (layer === 'back') {
                ctx.beginPath();
                ctx.ellipse(0, headY - 8, 28, 26, 0, 0, Math.PI);
                ctx.fill();
            } else {
                // 刘海
                ctx.beginPath();
                ctx.moveTo(-24, headY - 20);
                ctx.quadraticCurveTo(-15, headY - 40, 0, headY - 38);
                ctx.quadraticCurveTo(15, headY - 40, 24, headY - 20);
                ctx.quadraticCurveTo(15, headY - 18, 8, headY - 12);
                ctx.quadraticCurveTo(0, headY - 16, -8, headY - 12);
                ctx.quadraticCurveTo(-15, headY - 18, -24, headY - 20);
                ctx.fill();
                // 发丝遮眼
                if (config.eyeCover) {
                    ctx.beginPath();
                    ctx.moveTo(-4, headY - 20);
                    ctx.quadraticCurveTo(-8, headY - 10, -2, headY);
                    ctx.quadraticCurveTo(2, headY - 8, 0, headY - 18);
                    ctx.fill();
                }
            }
        } else if (config.hairStyle === 'long_hidden') {
            if (layer === 'back') {
                ctx.beginPath();
                ctx.moveTo(-28, headY - 15);
                ctx.quadraticCurveTo(-35, -20, -20, 50);
                ctx.lineTo(20, 50);
                ctx.quadraticCurveTo(35, -20, 28, headY - 15);
                ctx.quadraticCurveTo(0, headY - 45, -28, headY - 15);
                ctx.fill();
            } else {
                // 厚重刘海遮眼
                ctx.beginPath();
                ctx.moveTo(-25, headY - 15);
                ctx.quadraticCurveTo(-20, headY - 50, 0, headY - 48);
                ctx.quadraticCurveTo(20, headY - 50, 25, headY - 15);
                ctx.quadraticCurveTo(15, headY + 5, 0, headY - 2);
                ctx.quadraticCurveTo(-15, headY + 5, -25, headY - 15);
                ctx.fill();
            }
        } else if (config.hairStyle === 'long_straight') {
            if (layer === 'back') {
                ctx.beginPath();
                ctx.moveTo(-28, headY - 10);
                ctx.quadraticCurveTo(-32, headY - 40, -20, -80);
                ctx.lineTo(-22, 120);
                ctx.lineTo(22, 120);
                ctx.lineTo(20, -80);
                ctx.quadraticCurveTo(32, headY - 40, 28, headY - 10);
                ctx.quadraticCurveTo(0, headY - 50, -28, headY - 10);
                ctx.fill();
            } else {
                // 中分刘海
                ctx.beginPath();
                ctx.moveTo(-24, headY - 18);
                ctx.quadraticCurveTo(-18, headY - 45, -5, headY - 40);
                ctx.quadraticCurveTo(-3, headY - 25, -8, headY - 15);
                ctx.quadraticCurveTo(-15, headY - 18, -24, headY - 18);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(24, headY - 18);
                ctx.quadraticCurveTo(18, headY - 45, 5, headY - 40);
                ctx.quadraticCurveTo(3, headY - 25, 8, headY - 15);
                ctx.quadraticCurveTo(15, headY - 18, 24, headY - 18);
                ctx.fill();

                // 发丝遮挡右眼
                ctx.beginPath();
                ctx.moveTo(5, headY - 35);
                ctx.quadraticCurveTo(18, headY - 20, 15, headY + 15);
                ctx.quadraticCurveTo(18, headY, 8, headY - 15);
                ctx.fill();
            }
        } else if (config.hairStyle === 'gray_short') {
            if (layer === 'back') {
                ctx.beginPath();
                ctx.ellipse(0, headY - 12, 26, 22, 0, 0, Math.PI);
                ctx.fill();
                // 后脑勺短发
                ctx.beginPath();
                ctx.moveTo(-26, headY - 12);
                ctx.quadraticCurveTo(-32, headY + 20, -18, headY + 18);
                ctx.lineTo(18, headY + 18);
                ctx.quadraticCurveTo(32, headY + 20, 26, headY - 12);
                ctx.fill();
            } else {
                // 碎刘海
                ctx.beginPath();
                ctx.moveTo(-22, headY - 15);
                ctx.lineTo(-18, headY - 42);
                ctx.lineTo(-8, headY - 38);
                ctx.lineTo(0, headY - 45);
                ctx.lineTo(10, headY - 38);
                ctx.lineTo(18, headY - 42);
                ctx.lineTo(22, headY - 15);
                ctx.quadraticCurveTo(12, headY - 20, 0, headY - 14);
                ctx.quadraticCurveTo(-12, headY - 20, -22, headY - 15);
                ctx.fill();
            }
        } else if (config.hairStyle === 'medium_spiky') {
            if (layer === 'back') {
                ctx.beginPath();
                ctx.ellipse(0, headY - 10, 26, 24, 0, 0, Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-26, headY - 10);
                ctx.quadraticCurveTo(-30, headY + 15, -20, headY + 20);
                ctx.lineTo(20, headY + 20);
                ctx.quadraticCurveTo(30, headY + 15, 26, headY - 10);
                ctx.fill();
            } else {
                // 尖刺刘海
                ctx.beginPath();
                ctx.moveTo(-22, headY - 15);
                ctx.lineTo(-25, headY - 38);
                ctx.lineTo(-12, headY - 32);
                ctx.lineTo(-15, headY - 42);
                ctx.lineTo(-5, headY - 30);
                ctx.lineTo(-8, headY - 45);
                ctx.lineTo(2, headY - 32);
                ctx.lineTo(5, headY - 40);
                ctx.lineTo(15, headY - 32);
                ctx.lineTo(18, headY - 42);
                ctx.lineTo(28, headY - 30);
                ctx.lineTo(22, headY - 15);
                ctx.quadraticCurveTo(12, headY - 10, 0, headY - 12);
                ctx.quadraticCurveTo(-12, headY - 10, -22, headY - 15);
                ctx.fill();
            }
        }
    },

    _drawOutfit(ctx, config, action, frame, ink, paper, accent, hatching) {
        const baseY = 0;

        if (config.outfit === 'sailor') {
            // 水手服衣领
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.moveTo(-15, -50 + baseY);
            ctx.lineTo(-5, -58 + baseY);
            ctx.lineTo(0, -68 + baseY);
            ctx.lineTo(5, -58 + baseY);
            ctx.lineTo(15, -50 + baseY);
            ctx.lineTo(10, -42 + baseY);
            ctx.lineTo(0, -45 + baseY);
            ctx.lineTo(-10, -42 + baseY);
            ctx.closePath();
            ctx.fill();
            
            // 白领
            ctx.fillStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeStyle = ink;
            ctx.beginPath();
            ctx.moveTo(-12, -52 + baseY);
            ctx.lineTo(-3, -60 + baseY);
            ctx.lineTo(0, -55 + baseY);
            ctx.lineTo(3, -60 + baseY);
            ctx.lineTo(12, -52 + baseY);
            ctx.lineTo(8, -46 + baseY);
            ctx.lineTo(0, -50 + baseY);
            ctx.lineTo(-8, -46 + baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 百褶裙
            ctx.fillStyle = ink;
            ctx.strokeStyle = ink;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-28, 10 + baseY);
            ctx.lineTo(-50, 25 + baseY);
            ctx.lineTo(-45, 32 + baseY);
            ctx.lineTo(45, 32 + baseY);
            ctx.lineTo(50, 25 + baseY);
            ctx.lineTo(28, 10 + baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 裙褶
            ctx.lineWidth = 0.8;
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 12, 10 + baseY);
                ctx.lineTo(i * 18, 32 + baseY);
                ctx.stroke();
            }

            // 项圈圆环
            ctx.strokeStyle = ink;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -52 + baseY, 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, -52 + baseY, 3, 0, Math.PI * 2);
            ctx.stroke();

        } else if (config.outfit === 'loose_shirt') {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = ink;
            ctx.lineWidth = 2;
            
            // 宽松上衣
            ctx.beginPath();
            ctx.moveTo(-32, -55 + baseY);
            ctx.quadraticCurveTo(-38, 20, -30, 40);
            ctx.lineTo(30, 40);
            ctx.quadraticCurveTo(38, 20, 32, -55 + baseY);
            ctx.lineTo(22, -60 + baseY);
            ctx.lineTo(-22, -60 + baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 领口
            ctx.beginPath();
            ctx.moveTo(-8, -55 + baseY);
            ctx.quadraticCurveTo(0, -50, 8, -55 + baseY);
            ctx.stroke();

            // 袖长线条
            ctx.lineWidth = 0.6;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(-30 + i * 6, -40);
                ctx.lineTo(-28 + i * 4, 20);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(30 - i * 6, -40);
                ctx.lineTo(28 - i * 4, 20);
                ctx.stroke();
            }

        } else if (config.outfit === 'lolita') {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = ink;
            ctx.lineWidth = 2;

            // 复古衬衣
            ctx.beginPath();
            ctx.moveTo(-22, -55 + baseY);
            ctx.lineTo(-28, 0);
            ctx.lineTo(-32, 35);
            ctx.lineTo(32, 35);
            ctx.lineTo(28, 0);
            ctx.lineTo(22, -55 + baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 蕾丝荷叶边
            ctx.fillStyle = ink;
            for (let i = -28; i <= 28; i += 4) {
                ctx.beginPath();
                ctx.arc(i, 35, 3, Math.PI, Math.PI * 2);
                ctx.fill();
            }

            // 领结
            ctx.beginPath();
            ctx.moveTo(0, -55);
            ctx.lineTo(-12, -42);
            ctx.lineTo(-15, -45);
            ctx.lineTo(-10, -38);
            ctx.lineTo(0, -40);
            ctx.lineTo(10, -38);
            ctx.lineTo(15, -45);
            ctx.lineTo(12, -42);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 领结宝石
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, -42, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

        } else if (config.outfit === 'simple_shirt') {
            ctx.fillStyle = paper;
            ctx.strokeStyle = ink;
            ctx.lineWidth = 2;

            // 翻领衬衫
            ctx.beginPath();
            ctx.moveTo(-22, -55 + baseY);
            ctx.lineTo(-26, -45);
            ctx.lineTo(-28, 35);
            ctx.lineTo(28, 35);
            ctx.lineTo(26, -45);
            ctx.lineTo(22, -55 + baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 翻领
            ctx.beginPath();
            ctx.moveTo(-12, -55);
            ctx.lineTo(-18, -45);
            ctx.lineTo(-10, -42);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(12, -55);
            ctx.lineTo(18, -45);
            ctx.lineTo(10, -42);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

        } else if (config.outfit === 'combat') {
            ctx.fillStyle = ink;
            ctx.strokeStyle = ink;
            ctx.lineWidth = 2;

            // 黑色紧身衣
            ctx.beginPath();
            ctx.moveTo(-20, -55 + baseY);
            ctx.lineTo(-24, -30);
            ctx.lineTo(-26, 35);
            ctx.lineTo(26, 35);
            ctx.lineTo(24, -30);
            ctx.lineTo(20, -55 + baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 毛领外套 (搭在身后)
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-30, -50);
            ctx.quadraticCurveTo(-45, 20, -35, 60);
            ctx.lineTo(-25, 65);
            ctx.quadraticCurveTo(-38, 30, -28, -45);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(30, -50);
            ctx.quadraticCurveTo(45, 20, 35, 60);
            ctx.lineTo(25, 65);
            ctx.quadraticCurveTo(38, 30, 28, -45);
            ctx.stroke();

            // 毛领线条
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(-30 - i * 2, -50 - i * 3);
                ctx.lineTo(-28 - i * 3, -45 - i * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(30 + i * 2, -50 - i * 3);
                ctx.lineTo(28 + i * 3, -45 - i * 2);
                ctx.stroke();
            }

            // 匕首
            ctx.fillStyle = ink;
            ctx.beginPath();
            const handX = 50;
            const handY = 5;
            ctx.save();
            ctx.translate(handX, handY);
            ctx.rotate(-0.3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(3, 8);
            ctx.lineTo(-3, 8);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(-2, 8, 4, 15);
            ctx.fillStyle = '#fff';
            ctx.fillRect(-1, 23, 2, 3);
            ctx.restore();
        }

        // 玫瑰发饰 (角色3)
        if (config.accessory === 'rose') {
            ctx.fillStyle = ink;
            ctx.beginPath();
            ctx.arc(20, -95, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paper;
            ctx.beginPath();
            ctx.arc(20, -95, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = ink;
            ctx.lineWidth = 0.8;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(20, -95);
                const a = (i / 6) * Math.PI * 2;
                ctx.lineTo(20 + Math.cos(a) * 8, -95 + Math.sin(a) * 8);
                ctx.stroke();
            }
        }

        // 圆环耳环 (角色3)
        if (config.accessory === 'hoop') {
            ctx.strokeStyle = ink;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-22, -68, 5, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(22, -68, 5, 0, Math.PI * 2);
            ctx.stroke();
        }
    },

    _drawColoredBody(ctx, config, action, frame, outline, skin) {
        const baseY = 0;
        const legSpread = action === 'walk' ? Math.sin(frame * 0.4) * 12 : (action === 'idle' ? 3 : 0);
        
        ctx.lineWidth = 2;
        ctx.strokeStyle = outline;
        ctx.fillStyle = skin;

        // 躯干
        ctx.beginPath();
        ctx.moveTo(-20, -55);
        ctx.quadraticCurveTo(-24, 30, -18, 55);
        ctx.lineTo(18, 55);
        ctx.quadraticCurveTo(24, 30, 20, -55);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 阴影
        const shadowGrad = ctx.createLinearGradient(-20, 0, 20, 0);
        shadowGrad.addColorStop(0, 'rgba(0,0,0,0.08)');
        shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0.12)');
        ctx.fillStyle = shadowGrad;
        ctx.fillRect(-20, -50, 40, 100);

        // 腿 - 黑丝
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.moveTo(-8, 55);
        ctx.quadraticCurveTo(-12 - legSpread, 85, -14 - legSpread, 110);
        ctx.lineTo(-10 - legSpread, 115);
        ctx.quadraticCurveTo(-8, 85, -3, 55);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.moveTo(3, 55);
        ctx.quadraticCurveTo(12 + legSpread, 85, 14 + legSpread, 110);
        ctx.lineTo(10 + legSpread, 115);
        ctx.quadraticCurveTo(8, 85, 8, 55);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 腿部高光
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-10 - legSpread, 70);
        ctx.lineTo(-12 - legSpread, 105);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(10 + legSpread, 70);
        ctx.lineTo(12 + legSpread, 105);
        ctx.stroke();

        // 鞋子
        ctx.fillStyle = '#2a2a2a';
        ctx.strokeStyle = outline;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(-13 - legSpread, 115, 11, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(13 + legSpread, 115, 11, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 手臂
        const armAngle = this._getArmAngle(action, frame);
        ctx.fillStyle = skin;

        ctx.beginPath();
        ctx.moveTo(-20, -45);
        const la = armAngle.left;
        ctx.quadraticCurveTo(
            -22 + Math.cos(la) * 22, -15 + Math.sin(la) * 28,
            -26 + Math.cos(la) * 40, 5 + Math.sin(la) * 45
        );
        ctx.lineTo(-22 + Math.cos(la) * 40, 10 + Math.sin(la) * 45);
        ctx.quadraticCurveTo(-20, -20, -16, -50);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 猫爪手套
        const handX = -26 + Math.cos(la) * 40;
        const handY = 5 + Math.sin(la) * 45;
        ctx.fillStyle = '#fce4d6';
        ctx.beginPath();
        ctx.arc(handX, handY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // 猫爪肉垫
        ctx.fillStyle = '#ff8a9a';
        ctx.beginPath();
        ctx.arc(handX, handY + 2, 5, 0, Math.PI * 2);
        ctx.fill();
        // 指头
        for (let i = 0; i < 4; i++) {
            const a = -Math.PI/2 + (i - 1.5) * 0.4;
            ctx.beginPath();
            ctx.arc(handX + Math.cos(a) * 10, handY + Math.sin(a) * 10, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // 右臂
        const ra = armAngle.right;
        const reach = action === 'attack' ? 1.6 : (action === 'jump' ? 1.3 : 1);
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.moveTo(20, -45);
        ctx.quadraticCurveTo(
            22 + Math.cos(ra) * 22 * reach, -15 + Math.sin(ra) * 28 * reach,
            26 + Math.cos(ra) * 40 * reach, 5 + Math.sin(ra) * 45 * reach
        );
        ctx.lineTo(22 + Math.cos(ra) * 40 * reach, 10 + Math.sin(ra) * 45 * reach);
        ctx.quadraticCurveTo(20, -20, 16, -50);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const handX2 = 26 + Math.cos(ra) * 40 * reach;
        const handY2 = 5 + Math.sin(ra) * 45 * reach;
        ctx.fillStyle = '#fce4d6';
        ctx.beginPath();
        ctx.arc(handX2, handY2, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ff8a9a';
        ctx.beginPath();
        ctx.arc(handX2, handY2 + 2, 5, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 4; i++) {
            const a = -Math.PI/2 + (i - 1.5) * 0.4;
            ctx.beginPath();
            ctx.arc(handX2 + Math.cos(a) * 10, handY2 + Math.sin(a) * 10, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    },

    _drawColoredHead(ctx, config, action, frame, outline, skin, hairColor) {
        const bob = action === 'walk' ? Math.abs(Math.sin(frame * 0.4)) * 3 : 0;
        const headY = -80 - bob;

        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;

        // 颈部
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.moveTo(-6, -62 - bob);
        ctx.lineTo(6, -62 - bob);
        ctx.lineTo(5, headY + 8);
        ctx.lineTo(-5, headY + 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 头部
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.ellipse(0, headY, 22, 26, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 头发后层
        ctx.fillStyle = hairColor;
        ctx.beginPath();
        ctx.moveTo(-24, headY - 10);
        ctx.quadraticCurveTo(-32, headY - 40, -18, -80);
        ctx.quadraticCurveTo(-25, 50, -15, 120);
        ctx.lineTo(15, 120);
        ctx.quadraticCurveTo(25, 50, 18, -80);
        ctx.quadraticCurveTo(32, headY - 40, 24, headY - 10);
        ctx.quadraticCurveTo(0, headY - 48, -24, headY - 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 头发高光
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.moveTo(-15, headY - 30);
        ctx.quadraticCurveTo(-10, headY - 45, 0, headY - 42);
        ctx.quadraticCurveTo(8, headY - 45, 15, headY - 30);
        ctx.quadraticCurveTo(5, headY - 38, -5, headY - 32);
        ctx.closePath();
        ctx.fill();

        // 猫耳
        ctx.fillStyle = hairColor;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 1.5;
        
        // 左耳
        ctx.beginPath();
        ctx.moveTo(-20, headY - 22);
        ctx.lineTo(-28, headY - 55);

    _drawColoredOutfit(ctx, config, action, frame, outline, outfitMain, outfitAccent) {
        // 白色衬衫内衬
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = outline;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-18, -50);
        ctx.lineTo(-14, -55);
        ctx.lineTo(-8, -48);
        ctx.lineTo(8, -48);
        ctx.lineTo(14, -55);
        ctx.lineTo(18, -50);
        ctx.lineTo(22, 10);
        ctx.lineTo(-22, 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 针织背心
        ctx.fillStyle = outfitMain;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-20, -45);
        ctx.quadraticCurveTo(-24, 0, -22, 15);
        ctx.lineTo(-10, 15);
        ctx.lineTo(10, 15);
        ctx.lineTo(22, 15);
        ctx.quadraticCurveTo(24, 0, 20, -45);
        ctx.lineTo(14, -40);
        ctx.lineTo(6, -45);
        ctx.lineTo(-6, -45);
        ctx.lineTo(-14, -40);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 背心纹理
        ctx.strokeStyle = 'rgba(107, 88, 46, 0.3)';
        ctx.lineWidth = 0.6;
        for (let y = -38; y < 15; y += 4) {
            ctx.beginPath();
            ctx.moveTo(-22, y);
            ctx.lineTo(22, y);
            ctx.stroke();
        }

        // V领
        ctx.strokeStyle = '#5c4a2a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-8, -42);
        ctx.lineTo(0, -20);
        ctx.lineTo(8, -42);
        ctx.stroke();

        // 格纹百褶裙
        const skirtY = 15;
        const skirtH = 55;
        ctx.fillStyle = outfitAccent;
        ctx.strokeStyle = outline;
        ctx.lineWidth = 2;

        // 裙摆主体
        ctx.beginPath();
        ctx.moveTo(-24, skirtY);
        ctx.lineTo(-44, skirtY + skirtH);
        ctx.lineTo(44, skirtY + skirtH);
        ctx.lineTo(24, skirtY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 格纹线
        ctx.strokeStyle = 'rgba(60,40,20,0.4)';
        ctx.lineWidth = 0.8;
        // 横线
        for (let y = skirtY + 8; y < skirtY + skirtH; y += 10) {
            const t = (y - skirtY) / skirtH;
            const spread = 24 + (44 - 24) * t;
            ctx.beginPath();
            ctx.moveTo(-spread, y);
            ctx.lineTo(spread, y);
            ctx.stroke();
        }
        // 竖褶线
        for (let i = -4; i <= 4; i++) {
            if (i === 0) continue;
            ctx.beginPath();
            ctx.moveTo(i * 6, skirtY);
            const t = 1;
            const spread = i * (6 + Math.abs(i) * 2);
            ctx.lineTo(spread, skirtY + skirtH);
            ctx.stroke();
        }

        // 蝴蝶结领结
        ctx.fillStyle = '#b22222';
        ctx.strokeStyle = outline;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -45);
        ctx.lineTo(-10, -38);
        ctx.lineTo(-14, -42);
        ctx.lineTo(-10, -33);
        ctx.lineTo(0, -36);
        ctx.lineTo(10, -33);
        ctx.lineTo(14, -42);
        ctx.lineTo(10, -38);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 领结中心
        ctx.fillStyle = '#8b0000';
        ctx.beginPath();
        ctx.arc(0, -39, 3, 0, Math.PI * 2);
        ctx.fill();
    },
