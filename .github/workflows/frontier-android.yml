name: Build PROJECT FRONTIER Android APK
on:
  push:
    paths:
      - 'PROJECT_FRONTIER/**'
      - '.github/workflows/frontier-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl unzip ca-certificates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$TEMPLATE_DIR" "$CONFIG_DIR"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-4.3-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -oq /tmp/godot-4.3-templates.tpz -d /tmp/godot-templates
          test -d /tmp/godot-templates/templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          printf '4.3.stable\n' > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          JAVA_SDK_PATH="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          if [ ! -d "$ANDROID_SDK_PATH/platform-tools" ]; then
            for candidate in /opt/android-sdk /usr/lib/android-sdk /usr/local/lib/android/sdk; do
              if [ -d "$candidate/platform-tools" ]; then ANDROID_SDK_PATH="$candidate"; break; fi
            done
          fi
          test -d "$ANDROID_SDK_PATH/platform-tools"
          test -d "$ANDROID_SDK_PATH/platforms"
          test -x "$JAVA_SDK_PATH/bin/java"
          "$JAVA_SDK_PATH/bin/java" -version
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_PATH" "$JAVA_SDK_PATH" > "$CONFIG_DIR/editor_settings-4.3.tres"
          cat "$CONFIG_DIR/editor_settings-4.3.tres"
      - name: Prepare Android signing key
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import project
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          godot --headless --editor --path . --quit
      - name: Verify export preset uses prebuilt Android templates
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          grep -q '^gradle_build/use_gradle_build=false      - name: Export Android ARM64 APK
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PROJECT_FRONTIER.apk
          test -s build/PROJECT_FRONTIER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTIER-Android-ARM64-debug
          path: PROJECT_FRONTIER/build/PROJECT_FRONTIER.apk
          if-no-files-found: error
          retention-days: 7
 export_presets.cfg
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Export Android ARM64 APK
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PROJECT_FRONTIER.apk
          test -s build/PROJECT_FRONTIER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTIER-Android-ARM64-debug
          path: PROJECT_FRONTIER/build/PROJECT_FRONTIER.apk
          if-no-files-found: error
          retention-days: 7
