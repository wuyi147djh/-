name: Build PROJECT FRONTIER Android APK
on:
  push:
    paths:
      - 'PROJECT_FRONTIER/**'
      - '.github/workflows/frontier-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot Android export environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip ca-certificates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" "$HOME/.config/godot"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-4.3-templates.tpz
          unzip -oq /tmp/godot-4.3-templates.tpz -d "$HOME/.local/share/godot/export_templates/4.3.stable"
          printf '4.3.stable\n' > "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip"
          touch "$HOME/.config/godot/editor_settings-4.3.tres"
          grep -q 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.3.tres" || echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$HOME/.config/godot/editor_settings-4.3.tres"
      - name: Prepare Android signing key
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import project
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          godot --headless --editor --path . --quit
      - name: Install Android build template
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          godot --headless --editor --path . --install-android-build-template --quit
          test -f android/build.gradle
      - name: Export Android ARM64 APK
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PROJECT_FRONTIER.apk
          test -s build/PROJECT_FRONTIER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTIER-Android-ARM64-debug
          path: PROJECT_FRONTIER/build/PROJECT_FRONTIER.apk
          if-no-files-found: error
          retention-days: 7
