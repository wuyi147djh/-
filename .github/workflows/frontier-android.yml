name: Build PROJECT FRONTIER Android APK
on:
  push:
    paths:
      - 'PROJECT_FRONTIER/**'
      - '.github/workflows/frontier-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download licensed IRONLINE art assets
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cktang88/3d-fps.git /tmp/ironline-assets
          cd /tmp/ironline-assets
          git sparse-checkout set public/assets/models public/assets/textures public/assets/hdr public/assets/audio/guns public/assets/audio/foley public/assets/audio/steps public/assets/ambience
          mkdir -p "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline"
          cp -a public/assets/models "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/"
          cp -a public/assets/textures "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/"
          cp -a public/assets/hdr "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/"
          cp -a public/assets/audio "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/"
          cp -a public/assets/ambience "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/models/characters/soldier_tac.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/models/fp/m4a1.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/ambience/models/uh60/uh60.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/ambience/models/burnt_car/burnt_car.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/hdr/bambanani_sunset_2k.hdr"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/models/props/security_light/security_light.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/ironline/models/props/modular_industrial_pipes_01/modular_industrial_pipes_01.glb"
          echo "Required soldier, weapon, helicopter, wreck, HDR and military prop assets verified."
          mkdir -p "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world"
          curl -fL --retry 4 --retry-delay 2 "https://cdn.3dassets.dev/assets/28276/v1/model.glb" -o "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world/battle_royale_town_airfield.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world/battle_royale_town_airfield.glb"
          test "$(stat -c%s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world/battle_royale_town_airfield.glb")" -gt 5000000
          echo "Verified CC0 470k-triangle town and airfield environment."
          curl -fL --retry 4 --retry-delay 2 "https://cdn.3dassets.dev/assets/27595/v1/model.glb" -o "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world/tactical_hill_town_site_a.glb"
          test -s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world/tactical_hill_town_site_a.glb"
          test "$(stat -c%s "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets/world/tactical_hill_town_site_a.glb")" -gt 1500000
          echo "Verified tactical objective map: roofed buildings, courtyard, fountain, crates, sandbags and defenders (CC0 pack)."
          du -sh "$GITHUB_WORKSPACE/PROJECT_FRONTIER/assets"

      - name: Prepare Godot Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl unzip ca-certificates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$TEMPLATE_DIR" "$CONFIG_DIR"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-4.3-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -oq /tmp/godot-4.3-templates.tpz -d /tmp/godot-templates
          test -d /tmp/godot-templates/templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          printf '%s\n' '4.3.stable' > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          JAVA_SDK_PATH="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          test -d "$ANDROID_SDK_PATH/platform-tools"
          test -d "$ANDROID_SDK_PATH/platforms"
          test -x "$JAVA_SDK_PATH/bin/java"
          "$JAVA_SDK_PATH/bin/java" -version
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_PATH\""
            echo "export/android/java_sdk_path = \"$JAVA_SDK_PATH\""
          } > "$CONFIG_DIR/editor_settings-4.3.tres"
          cat "$CONFIG_DIR/editor_settings-4.3.tres"

      - name: Validate and import Godot project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          grep -q '^gradle_build/use_gradle_build=false$' export_presets.cfg
          godot --headless --editor --path . --quit

      - name: Capture real Godot gameplay frame (not AI-generated)
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1-mesa
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          mkdir -p build
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --path . --rendering-method gl_compatibility --resolution 1280x720 --quit-after 420 -- --capture-gameplay
          test -s build/PROJECT_FRONTIER-runtime.png
          file build/PROJECT_FRONTIER-runtime.png

      - name: Export Android ARM64 APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PROJECT_FRONTIER.apk
          test -s build/PROJECT_FRONTIER.apk
          unzip -l build/PROJECT_FRONTIER.apk | grep -E 'lib/arm64-v8a/.*[.]so'
          sha256sum build/PROJECT_FRONTIER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTIER-Android-ARM64-debug
          path: |\n            PROJECT_FRONTIER/build/PROJECT_FRONTIER.apk\n            PROJECT_FRONTIER/build/PROJECT_FRONTIER-runtime.png
          if-no-files-found: error
          retention-days: 7
