name: Build PROJECT FRONTIER Android APK
on:
  push:
    paths:
      - 'PROJECT_FRONTIER/**'
      - '.github/workflows/frontier-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot Android export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          mkdir -p ~/.config/godot
          touch ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/java_sdk_path' ~/.config/godot/editor_settings-4.3.tres || echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.3.tres
      - name: Prepare Android signing key
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import project
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          godot --headless --editor --path . --quit
      - name: Export Android ARM64 APK
        run: |
          cd "$GITHUB_WORKSPACE/PROJECT_FRONTIER"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PROJECT_FRONTIER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTIER-Android-ARM64-debug
          path: PROJECT_FRONTIER/build/PROJECT_FRONTIER.apk
          if-no-files-found: error
          retention-days: 7
